<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuffie Fighter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0019;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Arial Rounded MT Bold', 'Arial Black', Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}
#gameCanvas {
  border: 3px solid #ff69b4;
  border-radius: 10px;
  box-shadow: 0 0 30px #ff69b466, 0 0 80px #9b59b644;
  display: block;
  max-width: 100vw;
  max-height: 92vh;
}
#controls {
  color: #666;
  font-size: 11px;
  margin-top: 6px;
  text-align: center;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="900" height="500"></canvas>
<div id="controls">
  ← → Move &nbsp;|&nbsp; ↑ Jump &nbsp;|&nbsp; ↓ Block &nbsp;|&nbsp; Z Light Attack &nbsp;|&nbsp; X Medium Attack &nbsp;|&nbsp; Shift+Z Special (needs full meter)
</div>

<script>
// =====================================================================
// STUFFIE FIGHTER — Canvas Fighting Game
// =====================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;
const GROUND = 375;
const GRAVITY = 0.58;
const JUMP_POWER = -15;

// ---- Character Definitions ------------------------------------------
const CHARS = [
  {
    id: 'red_panda', name: 'Red Panda',
    c1: '#c0392b', c2: '#f5cba7', c3: '#f1c40f',
    eyeColor: '#2c3e50',
    stats: { spd: 9, pow: 7, def: 7 },
    special: 'Tail Tornado'
  },
  {
    id: 'bull', name: 'El Toro',
    c1: '#795548', c2: '#d7ccc8', c3: '#f1c40f',
    eyeColor: '#1a1a1a',
    stats: { spd: 5, pow: 10, def: 8 },
    special: 'Horn Charge'
  },
  {
    id: 'monkey', name: 'Bobo',
    c1: '#64b5f6', c2: '#f9ca24', c3: '#e17055',
    eyeColor: '#2d3436',
    stats: { spd: 8, pow: 7, def: 6 },
    special: 'Head Slam'
  },
  {
    id: 'beaver', name: 'Bucky',
    c1: '#8b5a2b', c2: '#d4a06a', c3: '#3d1a06',
    eyeColor: '#1a0a00',
    stats: { spd: 5, pow: 8, def: 9 },
    special: 'Timber!'
  },
  {
    id: 'dachshund', name: 'Wiener',
    c1: '#a0522d', c2: '#deb887', c3: '#8B0000',
    eyeColor: '#2c3e50',
    stats: { spd: 7, pow: 6, def: 7 },
    special: 'Rolling Sausage'
  },
  {
    id: 'penguin', name: 'Pebble',
    c1: '#1c2340', c2: '#f2f0e8', c3: '#ff8c00',
    eyeColor: '#1c2340',
    stats: { spd: 7, pow: 6, def: 7 },
    special: 'Belly Slide'
  },
  {
    id: 'bear', name: 'Ted E. Bear',
    c1: '#c07828', c2: '#f0d898', c3: '#7a3e10',
    eyeColor: '#1a0800',
    stats: { spd: 6, pow: 9, def: 8 },
    special: 'Bear Hug'
  },
  {
    id: 'turtle', name: 'Shellby',
    c1: '#66bb6a', c2: '#a5d6a7', c3: '#5d4037',
    eyeColor: '#1a1a1a',
    stats: { spd: 4, pow: 7, def: 10 },
    special: 'Shell Spin'
  },
];

// ---- Input ----------------------------------------------------------
const keys = {};
const justPressed = {};
const prevKeys = {};

window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  // Prevent arrow keys scrolling page
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function consumeJustPressed(code) {
  if (justPressed[code]) { justPressed[code] = false; return true; }
  return false;
}
function anyJustPressed(...codes) {
  for (const c of codes) if (consumeJustPressed(c)) return true;
  return false;
}

// ---- Particles ------------------------------------------------------
let particles = [];

function spawnParticles(x, y, color, count, type = 'hit') {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - 2,
      color,
      size: type === 'star' ? 5 + Math.random() * 5 : 3 + Math.random() * 5,
      life: 1,
      decay: 0.025 + Math.random() * 0.035,
      type
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.25;
    p.life -= p.decay;
    return p.life > 0;
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    if (p.type === 'star') {
      drawStarShape(p.x, p.y, p.size * p.life, 5);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawStarShape(x, y, r, pts) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i * Math.PI / pts) - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.4;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

// ---- Drawing Helpers ------------------------------------------------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawEye(cx, cy, r) {
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(cx + r * 0.2, cy + r * 0.1, r * 0.65, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx + r * 0.45, cy - r * 0.2, r * 0.28, 0, Math.PI * 2); ctx.fill();
}


// ---- Character Drawing (all drawn feet at y=0, facing right) --------

function drawRedPanda(state, ft) {
  const bob = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.08) * 3 : 0;
  const c = CHARS[0];

  // TAIL — whips forward on medium, spins on special, normal otherwise
  if (state === 'attack_medium') {
    ctx.fillStyle = c.c1;
    ctx.beginPath();
    ctx.moveTo(-5, -25 + bob);
    ctx.bezierCurveTo(18, -8 + bob, 58, -15 + bob, 70, -48 + bob);
    ctx.bezierCurveTo(76, -62 + bob, 58, -72 + bob, 44, -58 + bob);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.c3; ctx.globalAlpha = 0.65;
    ctx.beginPath(); ctx.arc(42, -52 + bob, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(58, -63 + bob, 6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(241,196,15,0.45)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(50, -25 + bob); ctx.quadraticCurveTo(70, -38 + bob, 68, -58 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(43, -19 + bob); ctx.quadraticCurveTo(63, -33 + bob, 61, -52 + bob); ctx.stroke();
  } else if (state === 'special') {
    ctx.strokeStyle = c.c1; ctx.lineWidth = 14; ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.arc(0, -52 + bob, 46, 0.1 * Math.PI, 1.95 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = c.c3; ctx.lineWidth = 6; ctx.globalAlpha = 0.65;
    ctx.beginPath(); ctx.arc(0, -52 + bob, 46, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -52 + bob, 46, 1.1 * Math.PI, 1.6 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    for (let sl = 0; sl < 10; sl++) {
      const a = (sl / 10) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*52, -52+bob+Math.sin(a)*52); ctx.lineTo(Math.cos(a)*64, -52+bob+Math.sin(a)*64); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    // TAIL — narrow arc behind body, drawn as thick bezier stroke
    const p0 = { x: -22, y: -50 + bob };
    const p1 = { x: -76, y: -28 + bob };
    const p2 = { x: -88, y: -74 + bob };
    const p3 = { x: -60, y: -108 + bob };

    const bezPt = t => {
      const u = 1 - t;
      return {
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
      };
    };
    const bezTan = t => {
      const u = 1 - t;
      return {
        x: 3*(u*u*(p1.x-p0.x) + 2*u*t*(p2.x-p1.x) + t*t*(p3.x-p2.x)),
        y: 3*(u*u*(p1.y-p0.y) + 2*u*t*(p2.y-p1.y) + t*t*(p3.y-p2.y)),
      };
    };

    // Dark outline pass
    ctx.strokeStyle = 'rgba(70,15,0,0.5)';
    ctx.lineWidth = 21; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
    ctx.stroke();

    // Main tail colour
    ctx.strokeStyle = c.c1;
    ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
    ctx.stroke();

    // Ring stripes — ellipses placed perpendicular to the tail direction
    [
      { t: 0.18, col: '#f5cba7' },
      { t: 0.36, col: c.c3      },
      { t: 0.54, col: '#f5cba7' },
      { t: 0.72, col: c.c3      },
      { t: 0.88, col: '#f5cba7' },
    ].forEach(r => {
      const pt  = bezPt(r.t);
      const tan = bezTan(r.t);
      const perp = Math.atan2(tan.y, tan.x) + Math.PI / 2;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(perp);
      ctx.fillStyle = r.col;
      ctx.globalAlpha = 0.86;
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 5, 0, 0, Math.PI * 2); // rx across tail, ry along tail
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    });

    // Fluffy white tip
    ctx.fillStyle = '#ecf0f1'; ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(p3.x, p3.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Body
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -48 + bob, 26, 30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(0, -44 + bob, 15, 20, 0, 0, Math.PI * 2); ctx.fill();

  // Legs
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(-11, -14 + bob, 9, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -14 + bob, 9, 14, 0, 0, Math.PI * 2); ctx.fill();

  // ARMS — each attack type is visually distinct
  if (state === 'attack_light') {
    // CLAW SWIPE — arm snapped out with 3 slash marks
    ctx.fillStyle = c.c1; roundRect(10, -65 + bob, 48, 12, 6); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.arc(60, -59 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
    [[62,-72,75,-54],[67,-70,80,-52],[72,-68,85,-50]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1+bob); ctx.lineTo(x2,y2+bob); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  } else if (state === 'attack_medium') {
    // TAIL WHIP — arms tucked, the tail does the damage
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-16, -58 + bob, 10, 15, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -58 + bob, 10, 15, -0.1, 0, Math.PI * 2); ctx.fill();
  } else if (state === 'attack_heavy') {
    // DOUBLE CLAW POUNCE — both claws forward with yellow impact lines
    ctx.fillStyle = c.c1;
    roundRect(8, -70 + bob, 44, 11, 6); ctx.fill();
    ctx.beginPath(); ctx.ellipse(34, -52 + bob, 22, 10, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.arc(53, -65 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(54, -46 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffff88'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.globalAlpha = 0.8;
    [[55,-76,67,-58],[60,-73,72,-55],[65,-70,77,-52],[58,-54,70,-36],[63,-51,75,-33]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1+bob); ctx.lineTo(x2,y2+bob); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  } else if (state === 'special') {
    // TORNADO — arms spread wide
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-32, -58 + bob, 18, 10, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(30, -58 + bob, 18, 10, 0.4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-16, -58 + bob, 10, 15, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, -58 + bob, 10, 15, -0.3, 0, Math.PI * 2); ctx.fill();
  }

  // Head
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(4, -83 + bob, 24, 0, Math.PI * 2); ctx.fill();
  // Ear markings
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(-14, -102 + bob, 11, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(22, -102 + bob, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.arc(-14, -102 + bob, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(22, -102 + bob, 6, 0, Math.PI * 2); ctx.fill();
  // White face
  ctx.fillStyle = '#ecf0f1';
  ctx.beginPath(); ctx.ellipse(4, -80 + bob, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  // Black mask markings
  ctx.fillStyle = '#2c3e50';
  ctx.beginPath(); ctx.ellipse(-5, -84 + bob, 7, 6, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -84 + bob, 7, 6, 0.3, 0, Math.PI * 2); ctx.fill();
  // Eyes
  drawEye(-4, -83 + bob, 5.5);
  drawEye(12, -83 + bob, 5.5);
  // Nose
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(4, -75 + bob, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBull(state, ft) {
  const bob = (state === 'idle') ? Math.sin(ft * 0.06) * 2 : 0;
  const c = CHARS[1];

  // Body (large, powerful)
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -52 + bob, 36, 40, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(0, -48 + bob, 22, 26, 0, 0, Math.PI * 2); ctx.fill();

  // Legs (thick)
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(-14, -16 + bob, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -16 + bob, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-14, -4 + bob, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -4 + bob, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  // ARMS
  if (state === 'attack_heavy' || state === 'special') {
    // Arms pulled back — head does the charging
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-20, -62 + bob, 13, 16, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -60 + bob, 13, 16, -0.2, 0, Math.PI * 2); ctx.fill();
  } else if (state === 'attack_medium') {
    // SHOULDER CHECK — big shoulder mass thrust forward
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-22, -63 + bob, 13, 18, 0.2, 0, Math.PI * 2); ctx.fill();
    roundRect(10, -78 + bob, 50, 24, 12); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(58, -66 + bob, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,50,0.5)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(66, -66 + bob, 20, -0.35*Math.PI, 0.35*Math.PI); ctx.stroke();
  } else if (state === 'attack_light') {
    // HOOF JAB — quick dark-hooved punch
    ctx.fillStyle = c.c1; roundRect(14, -70 + bob, 46, 16, 8); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(64, -62 + bob, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(-22, -63 + bob, 13, 18, 0.2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-22, -63 + bob, 13, 18, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22, -63 + bob, 13, 18, -0.2, 0, Math.PI * 2); ctx.fill();
  }

  // HEAD — tilted nose-down on charge so horns lead the attack
  if (state === 'attack_heavy' || state === 'special') {
    ctx.save();
    ctx.translate(22, -80 + bob);
    ctx.rotate(0.55);
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.arc(0, 0, 27, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.moveTo(8,-18); ctx.lineTo(30,-8); ctx.lineTo(12,-4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12,-16); ctx.lineTo(8,-30); ctx.lineTo(-2,-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(-18,-10,9,13,0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.ellipse(-18,-10,5,7,0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(14,10,14,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.arc(8,10,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(20,10,3.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(14,13,5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    drawEye(-8,0,7); drawEye(10,-4,7);
    // Horn impact sparks
    ctx.strokeStyle = 'rgba(255,220,30,0.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    [[22,-14,36,-8],[24,-6,38,0],[22,2,36,8]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
    ctx.restore();
  } else {
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.arc(8, -94 + bob, 27, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.moveTo(-8,-114+bob); ctx.lineTo(-26,-130+bob); ctx.lineTo(-12,-108+bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24,-114+bob); ctx.lineTo(40,-130+bob); ctx.lineTo(28,-108+bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-17,-106+bob,10,14,-0.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(33,-106+bob,10,14,0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e91e63';
    ctx.beginPath(); ctx.ellipse(-17,-106+bob,5,8,-0.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(33,-106+bob,5,8,0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(13,-87+bob,14,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.arc(7,-87+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18,-87+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;

}

function drawMonkey(state, ft) {
  const bob = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.1) * 4 : 0;
  const c = CHARS[2];

  // Body (small)
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -42 + bob, 20, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d6eaf8';
  ctx.beginPath(); ctx.ellipse(0, -38 + bob, 12, 17, 0, 0, Math.PI * 2); ctx.fill();

  // Legs
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(-9, -14 + bob, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -14 + bob, 8, 14, 0, 0, Math.PI * 2); ctx.fill();

  // Tail
  ctx.strokeStyle = c.c1; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, -38 + bob);
  ctx.quadraticCurveTo(-50, -45 + bob, -55, -70 + bob);

  // Head offset: shifts forward for headbutt attacks
  const hox = (state === 'attack_medium') ? 20 : (state === 'special') ? 32 : 0;

  // Neck connector when head is thrust forward
  if (hox > 0) {
    ctx.strokeStyle = c.c1; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, -62 + bob); ctx.quadraticCurveTo(hox, -72 + bob, hox, -82 + bob - hoy); ctx.stroke();
  }

  // ARMS
  if (state === 'attack_light') {
    // WILD OPEN-PALM SLAP — splayed fingers

      ctx.beginPath(); ctx.moveTo(x1,y1+bob); ctx.lineTo(x2,y2+bob); ctx.stroke();
    });
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(-14, -48+bob, 9, 14, 0.4, 0, Math.PI*2); ctx.fill();
  } else if (state === 'attack_medium' || state === 'special') {
    // HEAD BONK — arms flail back, head leads
    ctx.fillStyle = c.c1;

  } else if (state === 'attack_heavy') {
    // OVERHEAD DOUBLE FIST — both arms raised, smashing down
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(-18, -72 + bob, 9, 18, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -72 + bob, 9, 18, 0.2, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.arc(-18, -90 + bob, 11, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(255,200,50,0.65)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    [[-24,-96,-32,-108],[-18,-97,-18,-110],[-10,-96,-4,-108],[6,-96,-1,-108],[12,-97,12,-110],[20,-96,26,-108]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1+bob); ctx.lineTo(x2,y2+bob); ctx.stroke();
    });
  } else {

    ctx.beginPath(); ctx.ellipse(-14, -48 + bob, 9, 14, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -48 + bob, 9, 14, -0.4, 0, Math.PI * 2); ctx.fill();
  }

  // OVERSIZED HEAD — position shifts for bonk
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(hox, -88 + bob - hoy, 37, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(-34 + hox, -88 + bob - hoy, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(34 + hox, -88 + bob - hoy, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;

  drawEye(-10 + hox, -88 + bob - hoy, 8.5);
  drawEye(14 + hox, -88 + bob - hoy, 8.5);
  ctx.fillStyle = '#e17055';
  ctx.beginPath(); ctx.ellipse(2 + hox, -77 + bob - hoy, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  // Expression + impact lines during bonk
  if (hox > 0) {
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2.5;

}

function drawTurtle(state, ft) {
  const bob = (state === 'idle') ? Math.sin(ft * 0.05) * 2 : 0;
  const c = CHARS.find(ch => ch.id === 'turtle');

  // Shell base rim
  ctx.fillStyle = c.c3;
  ctx.beginPath(); ctx.ellipse(0, -50 + bob, 34, 9, 0, 0, Math.PI * 2); ctx.fill();

  // Shell dome
  ctx.fillStyle = c.c1;
  ctx.beginPath();
  ctx.arc(0, -58 + bob, 33, Math.PI, 0); ctx.fill();
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -58 + bob, 33, 33, 0, 0, Math.PI * 2); ctx.fill();

  // Shell pattern
  const hexData = [[0,-72+bob],[-14,-64+bob],[14,-64+bob],[-7,-80+bob],[7,-80+bob]];
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2;
  hexData.forEach(([hx, hy]) => {
    ctx.fillStyle = '#388e3c';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      if (i===0) ctx.moveTo(hx+Math.cos(a)*9, hy+Math.sin(a)*9);
      else ctx.lineTo(hx+Math.cos(a)*9, hy+Math.sin(a)*9);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  // Body peeking out
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(0, -44 + bob, 20, 12, 0, 0, Math.PI * 2); ctx.fill();

  // Legs (stubby)
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(-20, -30 + bob, 10, 14, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20, -30 + bob, 10, 14, 0.3, 0, Math.PI * 2); ctx.fill();

  // SPECIAL: retract into shell ball with spin lines — draw entirely differently
  if (state === 'special') {
    ctx.fillStyle = c.c3; ctx.beginPath(); ctx.arc(0, -45 + bob, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.arc(0, -45 + bob, 32, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2;
    [[0,-45+bob],[-14,-37+bob],[14,-37+bob],[-7,-53+bob],[7,-53+bob]].forEach(([hx,hy]) => {
      ctx.fillStyle = '#388e3c'; ctx.beginPath();
      for (let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/6;if(i===0)ctx.moveTo(hx+Math.cos(a)*9,hy+Math.sin(a)*9);else ctx.lineTo(hx+Math.cos(a)*9,hy+Math.sin(a)*9);}
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.5;
    for (let sl=0;sl<8;sl++){const a=(sl/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*36,-45+bob+Math.sin(a)*36);ctx.lineTo(Math.cos(a)*52,-45+bob+Math.sin(a)*52);ctx.stroke();}
    ctx.globalAlpha = 1;
    return;
  }

  // ARMS
  if (state === 'attack_light') {
    // SLOW DELIBERATE POKE — single arm, other tucked
    ctx.fillStyle = c.c2; roundRect(18, -56 + bob, 38, 12, 6); ctx.fill();
    ctx.beginPath(); ctx.arc(59, -50 + bob, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-18, -52 + bob, 8, 11, 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (state === 'attack_medium') {
    // SHELL BASH — motion lines show shell edge ramming forward
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(-18, -52 + bob, 8, 11, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, -52 + bob, 8, 11, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(56,142,60,0.5)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    [[30,-82+bob,50,-70+bob],[32,-68+bob,52,-58+bob],[30,-54+bob,50,-44+bob]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
  } else if (state === 'attack_heavy') {
    // SPIKE BURST — arms wide, sharp lines radiating from shell edge
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(-24, -50 + bob, 8, 11, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, -50 + bob, 8, 11, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    [[33,-84+bob,46,-96+bob],[35,-72+bob,50,-72+bob],[33,-60+bob,46,-50+bob],[34,-50+bob,46,-62+bob]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
  } else {
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(-18, -52 + bob, 8, 11, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, -52 + bob, 8, 11, -0.4, 0, Math.PI * 2); ctx.fill();
  }

  // Head
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.arc(12, -70 + bob, 18, 0, Math.PI * 2); ctx.fill();
  drawEye(4, -74 + bob, 5); drawEye(19, -74 + bob, 5);
  ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(12, -66 + bob, 6, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
}

function drawDachshund(state, ft) {
  const bob  = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.08) * 2 : 0;
  const walk = state === 'walk' ? Math.sin(ft * 0.16) : 0;
  const c = CHARS.find(ch => ch.id === 'dachshund');

  const isBite      = state === 'attack_light' || state === 'attack_heavy';
  const isTorpedo   = state === 'attack_medium';
  const isCorkscrew = state === 'special';

  // ---- Far-side legs: one front + one hind (behind body, dimmed) ----
  // Far-front and near-hind form a diagonal pair → opposite phase to near-front
  const farFrontX = 22 - walk * 4;
  const farHindX  = -22 + walk * 4;
  ctx.globalAlpha = 0.52;
  ctx.fillStyle = c.c1;
  [farFrontX, farHindX].forEach(lx => {
    ctx.beginPath(); ctx.ellipse(lx, -18 + bob, 6, 13, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = c.c2;
  [farFrontX, farHindX].forEach(lx => {
    ctx.beginPath(); ctx.ellipse(lx, -7 + bob, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ---- LONG body ----
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -38 + bob, 48, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(5, -33 + bob, 30, 12, 0, 0, Math.PI * 2); ctx.fill();

  // ---- Curly tail ----
  ctx.strokeStyle = c.c1; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-42, -42 + bob);
  ctx.quadraticCurveTo(-62, -58 + bob, -55, -74 + bob);
  ctx.stroke();

  // ---- Near-side legs: one front + one hind (in front of body, full colour) ----
  // Near-front and far-hind are the other diagonal pair → opposite phase to far-front
  const nearFrontX = 26 + walk * 4;
  const nearHindX  = -26 - walk * 4;
  ctx.fillStyle = c.c1;
  [nearFrontX, nearHindX].forEach(lx => {
    ctx.beginPath(); ctx.ellipse(lx, -18 + bob, 7, 14, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = c.c2;
  [nearFrontX, nearHindX].forEach(lx => {
    ctx.beginPath(); ctx.ellipse(lx, -7 + bob, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
  });

  if (isTorpedo) {
    // BODY TORPEDO — whole character tilts forward as missile, draw here and skip normal head
    ctx.save();
    ctx.translate(8, -38 + bob); ctx.rotate(-0.28);
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(0,0,48,20,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(5,4,30,12,0,0,Math.PI*2); ctx.fill();
    // Head at nose of torpedo
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(52,-8,18,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(65,-6,11,8,0.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(74,-5,4,3,0,0,Math.PI*2); ctx.fill();
    drawEye(44,-15,5);
    ctx.restore();
    // Speed lines
    ctx.strokeStyle = 'rgba(160,82,45,0.45)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    [[-16,-28+bob],[-20,-38+bob],[-14,-48+bob]].forEach(([ox,oy]) => {
      ctx.beginPath(); ctx.moveTo(-42+ox,oy); ctx.lineTo(-58+ox,oy); ctx.stroke();
    });
    return;
  }

  if (isCorkscrew) {
    // CORKSCREW — S-curve body with spiral motion rings
    ctx.strokeStyle = c.c1; ctx.lineWidth = 22; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-44,-28+bob); ctx.bezierCurveTo(-18,-8+bob,18,-65+bob,44,-44+bob); ctx.stroke();
    ctx.strokeStyle = c.c2; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(-42,-28+bob); ctx.bezierCurveTo(-16,-10+bob,16,-63+bob,42,-44+bob); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,82,45,0.3)'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(52,-44+bob,16,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(60,-42+bob,24,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    // Head at end of corkscrew
    ctx.fillStyle = c.c1; ctx.beginPath(); ctx.ellipse(44,-44+bob,18,15,0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(56,-42+bob,10,7,0.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(64,-41+bob,4,3,0,0,Math.PI*2); ctx.fill();
    drawEye(37,-50+bob,5);
    return;
  }

  // Normal head
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(38, -55 + bob, 22, 18, 0.15, 0, Math.PI * 2); ctx.fill();

  // Long floppy ear
  ctx.fillStyle = '#8b4513';
  ctx.beginPath();
  ctx.moveTo(22, -66 + bob);
  ctx.bezierCurveTo(12, -70 + bob, 8, -56 + bob, 16, -40 + bob);
  ctx.bezierCurveTo(20, -33 + bob, 26, -36 + bob, 24, -52 + bob);
  ctx.closePath(); ctx.fill();

  if (isBite) {
    // BITE — open jaw with upper/lower, teeth, tongue, angry brow
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(57, -59 + bob, 14, 7, 0.15, 0, Math.PI * 2); ctx.fill(); // upper jaw
    ctx.beginPath(); ctx.ellipse(57, -46 + bob, 14, 7, -0.15, 0, Math.PI * 2); ctx.fill(); // lower jaw
    ctx.fillStyle = '#fff';
    [51,57,63].forEach(tx => {
      ctx.beginPath(); ctx.moveTo(tx,-53+bob); ctx.lineTo(tx-1,-49+bob); ctx.lineTo(tx+3,-49+bob); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx+1,-52+bob); ctx.lineTo(tx,-56+bob); ctx.lineTo(tx+4,-56+bob); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.ellipse(55,-49+bob,6,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(68,-57+bob,5,4,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(26,-64+bob); ctx.lineTo(33,-61+bob); ctx.stroke(); // angry brow
    drawEye(32, -59 + bob, 6);
  } else {
    // Normal snout
    ctx.fillStyle = c.c2; ctx.beginPath(); ctx.ellipse(54,-53+bob,13,9,0.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(65,-52+bob,5,4,0,0,Math.PI*2); ctx.fill();
    drawEye(32, -59 + bob, 6);
  }

  // Collar
  ctx.fillStyle = c.c3; roundRect(27, -50 + bob, 14, 7, 3); ctx.fill();
  ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(36, -43 + bob, 4, 0, Math.PI * 2); ctx.fill();

}

function drawPenguin(state, ft) {
  const c = CHARS.find(ch => ch.id === 'penguin');
  const bob  = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.09) * 3 : 0;
  const walk = state === 'walk' ? Math.sin(ft * 0.16) : 0;

  const isFlipperSlap  = state === 'attack_light';
  const isBellyBounce  = state === 'attack_medium';
  const isBellySlide   = state === 'special';

  // ======= BELLY SLIDE — entire penguin tips forward horizontal and rockets across =======
  if (isBellySlide) {
    ctx.save();
    ctx.translate(10, -28);    // shift forward and down so belly sits near ground
    ctx.rotate(-0.48);         // tip forward ~27° onto belly

    // Ice trail behind the slide
    ctx.strokeStyle = 'rgba(168,224,255,0.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    [[-50,-8,18],[-56,-18,14],[-52,2,12],[-60,-28,9],[-58,10,8]].forEach(([x,y,len]) => {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(255,255,255,0.40)'; ctx.lineWidth = 2;
    [[-48,-13,10],[-54,6,8],[-62,-22,7]].forEach(([x,y,len]) => {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y); ctx.stroke();
    });

    // Body (now horizontal)
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.ellipse(0, -50, 30, 40, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-20, -70, 14, 18, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 20, -70, 14, 18,  0.15, 0, Math.PI * 2); ctx.fill();

    // Belly patch (now the leading surface)
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(0, -46, 18, 28, 0, 0, Math.PI * 2); ctx.fill();

    // Sheen
    const sg = ctx.createRadialGradient(-8, -72, 3, 0, -50, 36);
    sg.addColorStop(0, 'rgba(255,255,255,0.22)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(0, -50, 34, 44, 0, 0, Math.PI * 2); ctx.fill();

    // Flippers tucked tight against body
    ctx.fillStyle = c.c1;
    ctx.save(); ctx.translate(-30, -60); ctx.rotate(0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate( 30, -60); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

    // Feet trailing behind
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.ellipse(-10, -8, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 10, -8, 12, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Head
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, -97, 27, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(0, -95, 20, 22, 0, 0, Math.PI * 2); ctx.fill();

    // Beak
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.moveTo(0,-83); ctx.lineTo(-10,-94); ctx.lineTo(10,-94); ctx.closePath(); ctx.fill();

    // Eyes (squinting with focus)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-8, -107, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 8, -107, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(-8, -107, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 8, -107, 5.5, 0, Math.PI * 2); ctx.fill();
    // Squint lines above eyes
    ctx.strokeStyle = c.c1; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14,-114); ctx.lineTo(-3,-112); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 14,-114); ctx.lineTo( 3,-112); ctx.stroke();

    ctx.restore();
    return;
  }

  // ======= BELLY BOUNCE — squish down on impact, arms flung wide =======
  if (isBellyBounce) {
    // Impact rings at ground level
    ctx.strokeStyle = 'rgba(168,224,255,0.45)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, -4, 28, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(168,224,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -4, 44, 13, 0, 0, Math.PI * 2); ctx.stroke();
  }

  // --- Two orange webbed feet ---
  ctx.fillStyle = c.c3;
  ctx.beginPath(); ctx.ellipse(-13 + walk * 4, 0 + bob, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 13 - walk * 4, 0 + bob, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b85200'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  [-18,-13,-8].forEach(tx => { ctx.beginPath(); ctx.moveTo(tx+walk*4,-3+bob); ctx.lineTo(tx+walk*4,3+bob); ctx.stroke(); });
  [ 8, 13, 18].forEach(tx => { ctx.beginPath(); ctx.moveTo(tx-walk*4,-3+bob); ctx.lineTo(tx-walk*4,3+bob); ctx.stroke(); });

  // --- Body — squish on belly bounce (compress height, spread width) ---
  const bScaleX = isBellyBounce ? 1.18 : 1;
  const bScaleY = isBellyBounce ? 0.82 : 1;
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -50 + bob, 30 * bScaleX, 40 * bScaleY, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-20, -70 + bob, 14, 18, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 20, -70 + bob, 14, 18,  0.15, 0, Math.PI * 2); ctx.fill();

  // --- White belly patch ---
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(0, -46 + bob, 18 * bScaleX, 28 * bScaleY, 0, 0, Math.PI * 2); ctx.fill();

  // --- Plush sheen on body ---
  const bg = ctx.createRadialGradient(-8, -72 + bob, 3, 0, -50 + bob, 36);
  bg.addColorStop(0, 'rgba(255,255,255,0.20)'); bg.addColorStop(0.6, 'rgba(255,255,255,0.05)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, -50 + bob, 34, 44, 0, 0, Math.PI * 2); ctx.fill();

  // --- Flippers ---
  ctx.fillStyle = c.c1;
  ctx.save();
  ctx.translate(-33, -58 + bob);
  // Bounce: flung wide; Flipper slap: left pulls back; idle: gentle sway
  if (isBellyBounce)     ctx.rotate(-1.1);
  else if (isFlipperSlap) ctx.rotate(-0.8);
  else                   ctx.rotate(-0.18 - walk * 0.20);
  ctx.beginPath(); ctx.ellipse(0, 0, 9, 21, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(33, -58 + bob);
  if (isBellyBounce) {
    ctx.rotate(1.1);          // flung wide on bounce
  } else if (isFlipperSlap) {
    ctx.translate(18, -6);    // right flipper lunges outward
    ctx.rotate(-1.3);         // snaps to nearly horizontal
  } else {
    ctx.rotate(0.18 + walk * 0.20);
  }
  ctx.beginPath(); ctx.ellipse(0, 0, 9, 21, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // --- Flipper slap whoosh arc ---
  if (isFlipperSlap) {
    ctx.strokeStyle = 'rgba(168,224,255,0.65)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(36, -64 + bob, 32, -2.0, -0.6); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(200,235,255,0.55)';
    [[62,-54+bob,72,-62+bob],[66,-46+bob,78,-48+bob]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
  }

  // --- Head (squish on belly bounce) ---
  const hScaleY = isBellyBounce ? 0.88 : 1;
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(0, -97 + bob, 27, 27 * hScaleY, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(0, -95 + bob, 20, 22 * hScaleY, 0, 0, Math.PI * 2); ctx.fill();

  // Plush sheen on head
  const hg = ctx.createRadialGradient(-8, -116 + bob, 2, 0, -97 + bob, 28);
  hg.addColorStop(0, 'rgba(255,255,255,0.25)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -97 + bob, 29, 0, Math.PI * 2); ctx.fill();

  // --- Beak ---
  ctx.fillStyle = c.c3;
  ctx.beginPath();
  ctx.moveTo( 0, -83 + bob);
  ctx.lineTo(-10, -94 + bob);
  ctx.lineTo( 10, -94 + bob);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b85200'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -94 + bob); ctx.lineTo(0, -83 + bob); ctx.stroke();

  // --- Eyes (shared helper) ---
  const eye = (ex, ey) => {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ex, ey + bob, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(ex, ey + bob, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(ex + 2.5, ey - 2.5 + bob, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex - 1.5, ey + 2   + bob, 1.0, 0, Math.PI * 2); ctx.fill();
  };
  eye(-8, -107);
  eye( 8, -107);
}

function drawBeaver(state, ft) {
  const c = CHARS.find(ch => ch.id === 'beaver');
  const bob  = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.09) * 3 : 0;
  const walk = state === 'walk' ? Math.sin(ft * 0.16) : 0;

  const isChomp    = state === 'attack_light';   // Chomp  — head lunges, jaw snaps
  const isTailSlap = state === 'attack_medium';  // Tail Slap — tail whips forward
  const isTimber   = state === 'special';        // Timber! — log slam

  // Helper: filled circle
  const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y + bob, r, 0, Math.PI * 2); ctx.fill(); };

  // Tooth helper (rounded-bottom rectangle)
  const tooth = (tx, ty, tw, th) => {
    ctx.beginPath();
    ctx.moveTo(tx,      ty);
    ctx.lineTo(tx + tw, ty);
    ctx.lineTo(tx + tw, ty + th - 3);
    ctx.arcTo( tx + tw, ty + th, tx + tw - 3, ty + th, 3);
    ctx.lineTo(tx + 3,  ty + th);
    ctx.arcTo( tx,      ty + th, tx,           ty + th - 3, 3);
    ctx.closePath();
    ctx.fill();
  };

  // ======= TAIL SLAP — speed lines behind the swinging tail =======
  if (isTailSlap) {
    ctx.strokeStyle = 'rgba(139,90,43,0.65)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    [[30,-52,22],[36,-40,16],[40,-66,14]].forEach(([x,y,len]) => {
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke();
    });
  }

  // ======= BIG FLAT TAIL =======
  ctx.save();
  if (isTailSlap) {
    // Tail whipped to the forward (right) side, high arc
    ctx.translate(26, -48 + bob);
    ctx.rotate(-0.62);
  } else {
    // Normal resting position — behind the body
    ctx.translate(-24, -16 + bob);
    ctx.rotate(0.12);
  }
  ctx.fillStyle = c.c3;
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,180,100,0.12)';
  ctx.beginPath(); ctx.ellipse(-6, -4, 28, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20,8,2,0.28)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  [-7, -1, 5, 11].forEach(ty => { ctx.beginPath(); ctx.moveTo(-34, ty); ctx.lineTo(34, ty); ctx.stroke(); });
  ctx.strokeStyle = 'rgba(20,8,2,0.16)'; ctx.lineWidth = 1;
  [-20, -10, 0, 10, 20].forEach(tx => { ctx.beginPath(); ctx.moveTo(tx, -11); ctx.lineTo(tx, 11); ctx.stroke(); });
  ctx.restore();

  // --- Rounded haunches ---
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(-20, -28 + bob, 17, 26, -0.12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 20, -28 + bob, 17, 26,  0.12, 0, Math.PI * 2); ctx.fill();

  // --- Small feet ---
  ctx.fillStyle = c.c3;
  circ(-18 + walk * 2, -3, 10); circ(18 - walk * 2, -3, 10);
  ctx.fillStyle = c.c2;
  [-4, 0, 4].forEach(dx => { circ(-18 + walk*2 + dx, 3, 2.2); circ(18 - walk*2 + dx, 3, 2.2); });

  // --- Chubby body ---
  ctx.fillStyle = c.c1;
  circ(0,   -50, 30);
  circ(-16, -42, 20); circ( 16, -42, 20);
  circ(-18, -62, 17); circ( 18, -62, 17);
  circ(0,   -68, 22);

  // --- Lighter belly patch ---
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(6, -48 + bob, 16, 24, 0.08, 0, Math.PI * 2); ctx.fill();

  // --- Plush body sheen ---
  const bg = ctx.createRadialGradient(-8, -70 + bob, 3, 0, -50 + bob, 36);
  bg.addColorStop(0, 'rgba(255,210,140,0.32)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, -50 + bob, 36, 44, 0, 0, Math.PI * 2); ctx.fill();

  // ======= ARMS — pose changes per attack =======
  if (isTimber) {
    // Both arms raised overhead, gripping the log above
    ctx.save();
    ctx.translate(-20, -74 + bob);
    ctx.rotate(-0.42);
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(20, -74 + bob);
    ctx.rotate(0.42);
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // ======= LOG / BRANCH held aloft =======
    ctx.save();
    ctx.translate(32, -108 + bob);
    ctx.rotate(0.16);
    // Bark body
    ctx.fillStyle = '#5a3010';
    ctx.beginPath(); ctx.roundRect(-44, -9, 88, 18, 9); ctx.fill();
    // Wood grain
    ctx.strokeStyle = 'rgba(30,12,0,0.28)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    [-30,-16,-2,12,26].forEach(gx => {
      ctx.beginPath(); ctx.moveTo(gx, -7); ctx.lineTo(gx + 5, 7); ctx.stroke();
    });
    // Bark highlight
    ctx.fillStyle = 'rgba(255,180,80,0.18)';
    ctx.beginPath(); ctx.ellipse(-6, -4, 26, 4, 0.1, 0, Math.PI*2); ctx.fill();
    // Knot ring
    ctx.strokeStyle = 'rgba(30,12,0,0.45)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(20, 2, 7, 5, 0, 0, Math.PI*2); ctx.stroke();
    // End caps (cut-wood circles)
    ctx.fillStyle = '#7a4418';
    ctx.beginPath(); ctx.ellipse(-44, 0, 6, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 44, 0, 6, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(30,12,0,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-44, 0, 3, 5, 0, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse( 44, 0, 3, 5, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

  } else if (isTailSlap) {
    // Arms flung wide for spinning balance
    ctx.save();
    ctx.translate(-28, -64 + bob);
    ctx.rotate(-0.9);   // left arm sweeps back
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(28, -64 + bob);
    ctx.rotate(-0.48);  // right arm sweeps forward
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

  } else {
    // Normal tucked arms (idle / walk / chomp / hurt)
    ctx.save();
    ctx.translate(-22, -65 + bob);
    ctx.rotate(1.05 + walk * 0.08);
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(22, -65 + bob);
    ctx.rotate(-1.05 - walk * 0.08);
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.c3;
    ctx.beginPath(); ctx.arc(0, -19, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ======= HEAD — translated forward for Chomp =======
  const headDX = isChomp ? 24 : 0;
  const headDY = isChomp ?  5 : 0;
  ctx.save();
  ctx.translate(headDX, headDY);

  // Skull
  ctx.fillStyle = c.c1;
  circ(0,   -96, 25);
  circ(-10, -100, 16);
  circ( 10, -100, 16);
  circ(0,   -108, 18);

  // Head sheen
  const hg = ctx.createRadialGradient(-6, -116 + bob, 2, 0, -96 + bob, 28);
  hg.addColorStop(0, 'rgba(255,210,140,0.28)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  circ(0, -96, 30);

  // Ears
  ctx.fillStyle = c.c1;
  circ(-16, -118, 10); circ(16, -118, 10);
  ctx.fillStyle = c.c2;
  circ(-16, -118,  6); circ(16, -118,  6);

  // Muzzle / snout
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(14, -91 + bob, 14, 11, -0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -97 + bob, 11,  9,  0.1, 0, Math.PI*2); ctx.fill();

  // Big nose
  ctx.fillStyle = '#1a0800';
  ctx.beginPath(); ctx.ellipse(22, -97 + bob, 10, 8, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(19, -100 + bob, 3.5, 2.5, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(10,4,0,0.55)';
  ctx.beginPath(); ctx.ellipse(20, -97 + bob, 2, 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(25, -97 + bob, 2, 1.5, 0, 0, Math.PI*2); ctx.fill();

  // ======= TEETH — larger open jaw for Chomp =======
  if (isChomp) {
    // Open lower jaw
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(15, -78 + bob, 14, 9, -0.1, 0, Math.PI*2); ctx.fill();
    // Extra-big chomping teeth
    ctx.fillStyle = '#fffdf0';
    tooth( 5, -89 + bob, 10, 15);
    tooth(17, -89 + bob, 10, 15);
    ctx.strokeStyle = 'rgba(160,130,80,0.40)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(15, -89 + bob); ctx.lineTo(15, -74 + bob); ctx.stroke();
    ctx.strokeStyle = 'rgba(180,150,90,0.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(5, -89 + bob, 10, 15);
    ctx.strokeRect(17,-89 + bob, 10, 15);
    // Bite-arc swoosh in front of the open mouth
    ctx.strokeStyle = 'rgba(255,220,80,0.75)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(36, -86 + bob, 20, -Math.PI * 0.65, Math.PI * 0.15); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,80,0.35)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(36, -86 + bob, 26, -Math.PI * 0.55, 0.05); ctx.stroke();
  } else {
    // Normal closed teeth
    ctx.fillStyle = '#fffdf0';
    tooth( 8, -87 + bob, 8, 11);
    tooth(17, -87 + bob, 8, 11);
    ctx.strokeStyle = 'rgba(160,130,80,0.40)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(16, -87 + bob); ctx.lineTo(16, -76 + bob); ctx.stroke();
    ctx.strokeStyle = 'rgba(180,150,90,0.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(8, -87 + bob, 8, 11);
    ctx.strokeRect(17,-87 + bob, 8, 11);
  }

  // ======= EYES =======
  if (isTimber) {
    // Determined squint for the big slam
    ctx.fillStyle = '#1a0800';
    ctx.beginPath(); ctx.arc(-6, -106 + bob, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( 6, -106 + bob, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = c.c1; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, -107 + bob); ctx.lineTo(-2, -109 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(  2, -109 + bob); ctx.lineTo(12, -107 + bob); ctx.stroke();
  } else {
    // Normal eyes with catchlight
    ctx.fillStyle = '#1a0800';
    ctx.beginPath(); ctx.arc(-6, -106 + bob, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( 6, -106 + bob, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    ctx.beginPath(); ctx.arc(-4.2, -107.8 + bob, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(  7.8, -107.8 + bob, 1.6, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore(); // end head translate
}

function drawBear(state, ft) {
  const c = CHARS.find(ch => ch.id === 'bear');
  const bob  = (state === 'idle' || state === 'walk') ? Math.sin(ft * 0.08) * 3 : 0;
  const walk = state === 'walk' ? Math.sin(ft * 0.18) : 0;

  // Attack states
  const isPawSwipe  = state === 'attack_light';  // Paw Swipe   — quick claw swipe
  const isTummyRoll = state === 'attack_medium'; // Tummy Roll  — curl into spinning ball
  const isBearHug   = state === 'special';       // Bear Hug    — open-arm grab

  const bx = 0;

  // Scale down uniformly so the ears fit inside the character-card frame
  ctx.save();
  ctx.scale(0.84, 0.84);

  // ======= TUMMY ROLL — draw as a spinning ball, skip normal limb drawing =======
  if (isTummyRoll) {
    // Speed lines trailing behind the roll
    ctx.strokeStyle = 'rgba(160,100,30,0.55)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    [[-52,-42,16],[-58,-54,12],[-56,-30,13],[-64,-64,9],[-60,-20,8]].forEach(([x,y,len]) => {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y); ctx.stroke();
    });

    // Fluffy ball body — overlapping circles compressed into a tight sphere
    ctx.fillStyle = c.c1;
    ctx.beginPath(); ctx.arc(  4, -46, 42, 0, Math.PI * 2); ctx.fill(); // core
    ctx.beginPath(); ctx.arc(-20, -34, 28, 0, Math.PI * 2); ctx.fill(); // lower-left lobe
    ctx.beginPath(); ctx.arc( 24, -32, 27, 0, Math.PI * 2); ctx.fill(); // lower-right lobe
    ctx.beginPath(); ctx.arc(-18, -60, 24, 0, Math.PI * 2); ctx.fill(); // upper-left lobe
    ctx.beginPath(); ctx.arc( 22, -58, 24, 0, Math.PI * 2); ctx.fill(); // upper-right lobe
    ctx.beginPath(); ctx.arc(  4, -72, 20, 0, Math.PI * 2); ctx.fill(); // top lobe (ear hint)
    ctx.beginPath(); ctx.arc(  4, -14, 18, 0, Math.PI * 2); ctx.fill(); // bottom lobe (feet tuck)

    // Plush sheen on ball
    const rg = ctx.createRadialGradient(-8, -66, 4, 4, -46, 50);
    rg.addColorStop(0,   'rgba(255,220,150,0.38)');
    rg.addColorStop(0.5, 'rgba(255,200,120,0.12)');
    rg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(4, -46, 52, 0, Math.PI * 2); ctx.fill();

    // Belly patch — visible on the leading (forward-facing) side of the ball
    ctx.fillStyle = c.c2;
    ctx.beginPath(); ctx.ellipse(22, -43, 20, 26, 0.2, 0, Math.PI * 2); ctx.fill();

    // Spin arc marks across the ball surface
    ctx.strokeStyle = 'rgba(100,55,10,0.22)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc( 4, -46, 34, 0.25, 1.55); ctx.stroke();
    ctx.beginPath(); ctx.arc( 4, -46, 26, -2.7, -1.4); ctx.stroke();
    ctx.beginPath(); ctx.arc( 4, -46, 18,  1.6,  2.85); ctx.stroke();

    ctx.restore(); // end 0.84 scale
    return;
  }

  // Helper: filled circle (used in all non-roll states)
  const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y + bob, r, 0, Math.PI * 2); ctx.fill(); };

  // --- Short pudgy legs ---
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.ellipse(-14 + walk * 5, -14 + bob, 15, 17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 14 - walk * 5, -14 + bob, 15, 17, 0, 0, Math.PI * 2); ctx.fill();

  // --- Round paw feet ---
  ctx.fillStyle = c.c3;
  circ(-17 + walk * 5, -3, 16); circ(17 - walk * 5, -3, 16);
  ctx.fillStyle = c.c2;
  [-6, 0, 6].forEach(dx => { circ(-17 + walk * 5 + dx, 3, 3.5); circ(17 - walk * 5 + dx, 3, 3.5); });

  // --- Fluffy body ---
  ctx.fillStyle = c.c1;
  circ(bx,      -52, 38);
  circ(bx - 20, -44, 26);
  circ(bx + 20, -44, 26);
  circ(bx - 24, -65, 22);
  circ(bx + 24, -65, 22);
  circ(bx,      -72, 26);

  // --- Plush highlight sheen on body ---
  const bgrad = ctx.createRadialGradient(bx - 10, -72 + bob, 4, bx, -52 + bob, 44);
  bgrad.addColorStop(0,   'rgba(255,220,150,0.35)');
  bgrad.addColorStop(0.5, 'rgba(255,200,120,0.1)');
  bgrad.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = bgrad;
  ctx.beginPath(); ctx.ellipse(bx, -52 + bob, 44, 50, 0, 0, Math.PI * 2); ctx.fill();

  // --- Soft belly patch ---
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(bx, -50 + bob, 22, 30, 0, 0, Math.PI * 2); ctx.fill();

  // ======= ARMS =======

  // --- LEFT arm ---
  ctx.save();
  ctx.translate(bx - 40, -65 + bob);
  if (isPawSwipe) ctx.rotate(-0.9);               // pulled back before swipe
  else if (isBearHug) ctx.rotate(1.15);           // spread wide open for hug
  else                ctx.rotate(-0.4 - walk * 0.14);
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(0,   0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -16, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c3;
  ctx.beginPath(); ctx.arc(0, -28, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  [-5, 0, 5].forEach(dx => { ctx.beginPath(); ctx.arc(dx, -34, 3.5, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();

  // --- RIGHT arm ---
  ctx.save();
  ctx.translate(bx + 40, -65 + bob);
  if (isPawSwipe) {
    ctx.translate(26, -8);
    ctx.rotate(-1.25);      // nearly horizontal claw swipe
  } else if (isBearHug) {
    ctx.rotate(-1.15);      // spread wide open for hug
  } else {
    ctx.rotate(0.4 + walk * 0.14);
  }
  ctx.fillStyle = c.c1;
  ctx.beginPath(); ctx.arc(0,   0, 16, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -16, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c3;
  ctx.beginPath(); ctx.arc(0, -28, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.c2;
  [-5, 0, 5].forEach(dx => { ctx.beginPath(); ctx.arc(dx, -34, 3.5, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();

  // --- PAW SWIPE swoosh arc & claw marks ---
  if (isPawSwipe) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,200,80,0.60)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(bx + 42, -73 + bob, 40, -1.9, -0.55); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,230,120,0.55)';
    [[bx+74,-70+bob,bx+86,-80+bob],[bx+78,-62+bob,bx+92,-57+bob],[bx+70,-79+bob,bx+80,-91+bob]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
    ctx.restore();
  }

  // --- BEAR HUG floating hearts ---
  if (isBearHug) {
    const heartAt = (hx, hy, sz, alpha) => {
      ctx.save(); ctx.translate(hx, hy + bob); ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff6090'; ctx.beginPath();
      ctx.moveTo(0, -sz * 0.5);
      ctx.bezierCurveTo( sz, -sz * 1.4,  sz * 1.8,  sz * 0.2, 0,  sz * 1.2);
      ctx.bezierCurveTo(-sz * 1.8,  sz * 0.2, -sz, -sz * 1.4, 0, -sz * 0.5);
      ctx.fill(); ctx.restore();
    };
    heartAt(-48, -78, 7, 0.70);
    heartAt( 58, -76, 7, 0.70);
    heartAt(  0,-138, 6, 0.60);
    heartAt(-26,-124, 5, 0.55);
    heartAt( 30,-122, 5, 0.55);
  }

  // ======= HEAD =======

  // --- Fluffy head ---
  ctx.fillStyle = c.c1;
  circ(bx,      -107, 36);
  circ(bx - 18, -112, 22);
  circ(bx + 18, -112, 22);
  circ(bx,      -120, 26);

  // --- Plush sheen on head ---
  const hgrad = ctx.createRadialGradient(bx - 8, -120 + bob, 3, bx, -107 + bob, 40);
  hgrad.addColorStop(0, 'rgba(255,220,150,0.30)');
  hgrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hgrad;
  circ(bx, -107, 40);

  // --- Round plush ears ---
  ctx.fillStyle = c.c1;
  circ(bx - 26, -137, 18); circ(bx + 26, -137, 18);
  circ(bx - 28, -140, 12); circ(bx + 28, -140, 12);
  ctx.fillStyle = c.c2;
  circ(bx - 26, -138, 10); circ(bx + 26, -138, 10);

  // --- Muzzle ---
  ctx.fillStyle = c.c2;
  ctx.beginPath(); ctx.ellipse(bx - 8, -98 + bob, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 8, -98 + bob, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 1, -99 + bob, 10, 11, 0, 0, Math.PI * 2); ctx.fill();

  // --- Button nose ---
  ctx.fillStyle = '#1a0800';
  ctx.beginPath(); ctx.ellipse(bx + 1, -104 + bob, 8, 6, 0, 0, Math.PI * 2); ctx.fill();

  // --- Mouth — stitched smile normally, determined scowl during Bear Hug ---
  ctx.strokeStyle = '#2a0e00'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (isBearHug) {
    ctx.beginPath(); ctx.moveTo(bx - 6, -93 + bob); ctx.lineTo(bx + 8, -93 + bob); ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(bx - 22, -118 + bob); ctx.lineTo(bx - 9, -113 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + 9,  -118 + bob); ctx.lineTo(bx + 22, -113 + bob); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(bx + 1, -98 + bob); ctx.lineTo(bx - 6, -91 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + 1, -98 + bob); ctx.lineTo(bx + 8, -91 + bob); ctx.stroke();
  }

  // --- Button eyes with X-stitch ---
  ctx.fillStyle = '#1a0800';
  circ(bx - 15, -115, 8); circ(bx + 15, -115, 8);
  ctx.strokeStyle = '#3a1200'; ctx.lineWidth = 1.2;
  const xs = [[bx-19,-119,bx-11,-111],[bx-11,-119,bx-19,-111],
               [bx+11,-119,bx+19,-111],[bx+19,-119,bx+11,-111]];
  xs.forEach(([x1, y1, x2, y2]) => {
    ctx.beginPath(); ctx.moveTo(x1, y1 + bob); ctx.lineTo(x2, y2 + bob); ctx.stroke();
  });
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  circ(bx - 13, -117, 3); circ(bx + 17, -117, 3);

  ctx.restore(); // end 0.84 scale
}

// Draw character at position (cx, cy = feet), scale, facing, state
function drawChar(charId, cx, cy, facing, state, ft, scale = 1, flashRed = false) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(facing * scale, scale);

  if (flashRed) {
    ctx.filter = 'brightness(2) sepia(1) saturate(10) hue-rotate(-20deg)';
  }

  switch (charId) {
    case 'red_panda': drawRedPanda(state, ft); break;
    case 'bull':      drawBull(state, ft); break;
    case 'monkey':    drawMonkey(state, ft); break;
    case 'turtle':    drawTurtle(state, ft); break;
    case 'dachshund': drawDachshund(state, ft); break;
    case 'penguin':   drawPenguin(state, ft); break;
    case 'bear':      drawBear(state, ft); break;
    case 'beaver':    drawBeaver(state, ft); break;
  }

  ctx.restore();
}

// ---- Fighter Class --------------------------------------------------
class Fighter {
  constructor(char, x, facing) {
    this.char = char;
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.facing = facing;
    this.health = 100;
    this.maxHealth = 100;
    this.specialMeter = 0;
    this.grounded = true;

    // State machine
    this.state = 'idle'; // idle, walk, jump, block, hurt, knockdown, attack_light, attack_medium, attack_heavy, special
    this.stateFrames = 0; // frames in current state
    this.stateDuration = 0; // total frames for timed states

    // Attack
    this.attackActive = false;
    this.attackDamage = 0;
    this.attackRange = 0;
    this.attackHit = false; // has this attack already landed?

    // Visual
    this.ft = 0; // frame timer for animation
    this.hitFlash = 0;
    this.invFrames = 0;

    // Scoring
    this.wins = 0;
  }

  get hitW() { return 52; }
  get hitH() { return 110; }

  hitbox() {
    return { x: this.x - this.hitW / 2, y: this.y - this.hitH, w: this.hitW, h: this.hitH };
  }

  attackBox() {
    if (!this.attackActive) return null;
    const r = this.attackRange;
    const bx = this.facing === 1 ? this.x + 10 : this.x - 10 - r;
    return { x: bx, y: this.y - 90, w: r, h: 50 };
  }

  setState(s, duration = 0) {
    this.state = s;
    this.stateFrames = 0;
    this.stateDuration = duration;
    this.attackActive = false;
    this.attackHit = false;
  }

  doAttack(type) {
    if (this.hitFlash > 8 && this.invFrames > 0) return;
    const busy = ['attack_light','attack_medium','attack_heavy','special','hurt','knockdown'];
    if (busy.includes(this.state)) return;

    const sp = this.char.stats.pow;
    let dmg, dur, range, windupFrac, activeFrac;

    if (type === 'special') {
      if (this.specialMeter < 100) return;
      this.specialMeter = 0;
      dmg = 16 + sp * 1.0;   // ~22–26 — big reward, but not a one-shot
      dur = 52; windupFrac = 0.25; activeFrac = 0.45;
      range = 90 + sp * 4;
      if (this.char.id === 'bear') {
        // Bear Hug: pink hearts + warm sparkles
        spawnParticles(this.x, this.y - 70, '#ff6090', 14, 'star');
        spawnParticles(this.x, this.y - 50, '#ffb8d0', 8, 'hit');
      } else if (this.char.id === 'penguin') {
        // Belly Slide: icy blue + white snow burst
        spawnParticles(this.x, this.y - 20, '#a8e0ff', 16, 'star');
        spawnParticles(this.x, this.y - 10, '#ffffff', 10, 'hit');
      } else if (this.char.id === 'beaver') {
        // Timber!: wood chips + bark splinters burst
        spawnParticles(this.x + this.facing * 60, this.y - 44, '#8b5a2b', 14, 'hit');
        spawnParticles(this.x + this.facing * 50, this.y - 32, '#5a3010', 8, 'star');
        spawnParticles(this.x + this.facing * 40, this.y - 20, '#c8a060', 6, 'hit');
      } else {
        spawnParticles(this.x, this.y - 60, '#f1c40f', 15, 'star');
      }
    } else if (type === 'heavy') {
      dmg = 8 + sp * 0.6;    // ~12–14 — meaningful but takes ~7 hits to KO
      dur = 42; windupFrac = 0.35; activeFrac = 0.6;
      range = 80 + sp * 3;
    } else if (type === 'medium') {
      dmg = 5 + sp * 0.4;    // ~8–9
      dur = 30; windupFrac = 0.3; activeFrac = 0.6;
      range = 70 + sp * 2;
    } else { // light
      dmg = 3 + sp * 0.25;   // ~5–6 — fast but requires ~18 hits to KO
      dur = 22; windupFrac = 0.25; activeFrac = 0.6;
      range = 60 + sp;
    }

    this.attackDamage = Math.floor(dmg);
    this.attackRange = Math.floor(range);
    this.attackWindup = Math.floor(dur * windupFrac);
    this.attackEnd = Math.floor(dur * (windupFrac + activeFrac));
    this.setState(type === 'special' ? 'special' : 'attack_' + type, dur);
  }

  takeDamage(amount) {
    if (this.invFrames > 0) return false;

    let blocked = false;
    if (this.state === 'block') {
      amount = Math.floor(amount * 0.12);
      blocked = true;
      spawnParticles(this.x + this.facing * 25, this.y - 50, '#4ecdc4', 6, 'hit');
    }

    this.health = Math.max(0, this.health - amount);
    this.hitFlash = 12;
    this.invFrames = blocked ? 10 : 22;
    this.specialMeter = Math.min(100, this.specialMeter + amount * 0.8);

    if (!blocked) {
      if (amount >= 18) {
        this.state = 'knockdown';
        this.stateFrames = 0; this.stateDuration = 45;
        this.vy = -9; this.vx = -this.facing * 6;
        this.grounded = false;
      } else {
        this.setState('hurt', 18);
      }
      spawnParticles(this.x + this.facing * 20, this.y - 60, '#ff6b6b', 10, 'hit');
      spawnParticles(this.x + this.facing * 20, this.y - 55, '#fff', 4, 'star');
    }

    return true;
  }

  update(input) {
    this.ft++;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.invFrames > 0) this.invFrames--;

    // Special meter passive fill
    this.specialMeter = Math.min(100, this.specialMeter + 0.04);

    // Gravity
    if (!this.grounded) {
      this.vy += GRAVITY;
      this.y += this.vy;
      if (this.y >= GROUND) {
        this.y = GROUND; this.vy = 0; this.grounded = true;
        if (this.state === 'jump') this.setState('idle');
        if (this.state === 'knockdown') { this.setState('idle'); spawnParticles(this.x, this.y, '#bbb', 5, 'hit'); }
      }
    }

    // Knockdown slide
    if (this.state === 'knockdown') {
      this.x += this.vx;
      this.vx *= 0.82;
    }

    // Timed state countdown
    if (this.stateDuration > 0) {
      this.stateFrames++;
      // Attack activation window
      if (['attack_light','attack_medium','attack_heavy','special'].includes(this.state)) {
        this.attackActive = (this.stateFrames >= this.attackWindup && this.stateFrames <= this.attackEnd);
      }
      if (this.stateFrames >= this.stateDuration) {
        const prev = this.state;
        this.setState('idle');
        if (prev === 'hurt') {}
      }
    }

    // Input-driven behaviour
    if (input && !['hurt','knockdown'].includes(this.state)) {
      const canMove = !['attack_light','attack_medium','attack_heavy','special'].includes(this.state);

      if (canMove) {
        const spd = 3.8 + this.char.stats.spd * 0.25;

        if (input.down && this.grounded) {
          this.state = 'block';
          this.vx = 0;
        } else {
          if (this.state === 'block') this.setState('idle');

          if (input.left) {
            this.x -= spd;
            if (this.grounded) this.state = 'walk';
          } else if (input.right) {
            this.x += spd;
            if (this.grounded) this.state = 'walk';
          } else {
            if (this.state === 'walk') this.setState('idle');
          }

          if (input.up && this.grounded) {
            this.vy = JUMP_POWER - this.char.stats.spd * 0.1;
            this.grounded = false;
            this.setState('jump');
          }
        }

        if (input.special)  this.doAttack('special');
        else if (input.heavy)  this.doAttack('heavy');
        else if (input.medium) this.doAttack('medium');
        else if (input.light)  this.doAttack('light');
      }
    }

    // Bounds
    this.x = Math.max(55, Math.min(W - 55, this.x));
  }

  draw() {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 30, 7, 0, 0, Math.PI * 2); ctx.fill();

    drawChar(this.char.id, this.x, this.y, this.facing, this.state, this.ft, 1, this.hitFlash > 0);

    // Block shield effect
    if (this.state === 'block') {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(this.ft * 0.2) * 0.15;
      ctx.fillStyle = '#4ecdc4';
      ctx.beginPath();
      ctx.ellipse(this.x + this.facing * 20, this.y - 55, 28, 45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

  }
}

// ---- AI Controller --------------------------------------------------
class AI {
  constructor(fighter) {
    this.f = fighter;
    this.timer = 0;
    this.action = 'approach';
  }

  getInput(player) {
    const inp = { left:false, right:false, up:false, down:false, light:false, medium:false, heavy:false, special:false };
    if (!player) return inp;

    const dist = Math.abs(this.f.x - player.x);
    const toward = this.f.x < player.x ? 'right' : 'left';
    const away   = toward === 'right' ? 'left' : 'right';

    // Don't act while busy
    const busy = ['attack_light','attack_medium','attack_heavy','special','hurt','knockdown'];
    if (busy.includes(this.f.state)) return inp;

    this.timer--;
    if (this.timer <= 0) {
      this.timer = 8 + Math.floor(Math.random() * 18);
      const r = Math.random();
      if (dist < 85) {
        if (r < 0.08) this.action = 'jump_away';
        else if (r < 0.22) this.action = 'block';
        else if (r < 0.38 && this.f.specialMeter >= 100) this.action = 'special';
        else if (r < 0.60) this.action = 'heavy';
        else this.action = 'light';
      } else if (dist < 220) {
        if (r < 0.45) this.action = 'approach';
        else if (r < 0.70) this.action = 'light';
        else this.action = 'jump_approach';
      } else {
        this.action = r < 0.75 ? 'approach' : 'jump_approach';
      }
    }

    switch (this.action) {
      case 'approach':      inp[toward] = true; break;
      case 'jump_away':     inp[away] = true; inp.up = true; break;
      case 'jump_approach': inp[toward] = true; inp.up = Math.random() < 0.15; break;
      case 'block':         inp.down = true; break;
      case 'light':         inp.light = true; inp[toward] = true; break;
      case 'medium':        inp.medium = true; inp[toward] = true; break;
      case 'heavy':         inp.heavy = true; break;
      case 'special':       inp.special = true; break;
    }
    return inp;
  }
}

  // Crayon sun — left, very high (zone 1)
  ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(130, 42, 22, 0, Math.PI * 2); ctx.stroke();
  for (let a = 0; a < 8; a++) {
    const ang = (a / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(130 + Math.cos(ang) * 28, 42 + Math.sin(ang) * 28);

  ctx.beginPath(); ctx.moveTo(306, 90); ctx.lineTo(335, 64); ctx.lineTo(365, 90); ctx.stroke();
  // Crayon tree — center-right, low (zone 4)

  // Crayon rainbow — right side, mid-low (zone 3)

  ctx.strokeStyle = '#f39c12';
  ctx.beginPath(); ctx.arc(725, 122, 23, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = '#3498db';
  ctx.beginPath(); ctx.arc(725, 122, 14, Math.PI, 0); ctx.stroke();
  // Small cloud feet at rainbow base

  ctx.beginPath(); ctx.arc(693, 124, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(757, 124, 8, 0, Math.PI * 2); ctx.stroke();

  // Bookshelf — left
  ctx.fillStyle = '#a0522d'; ctx.fillRect(0, GROUND - 190, 60, 190);
  ctx.fillStyle = '#7a3e1d';
  [0, 1, 2].forEach(sh => ctx.fillRect(0, GROUND - 55 - sh * 60, 60, 5));
  ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'].forEach((c, i) => {

  // Bookshelf — right
