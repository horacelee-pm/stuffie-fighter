  ctx.fillStyle = '#7a3e1d';
  [0, 1, 2].forEach(sh => ctx.fillRect(W - 60, GROUND - 55 - sh * 60, 60, 5));
  ['#f1c40f','#e67e22','#2980b9','#27ae60','#c0392b','#8e44ad'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(W - 56 + (i % 3) * 18, GROUND - 52 - Math.floor(i / 3) * 60, 14, 42);
  });

  // Building blocks — scattered on the floor near each side
  const blockDefs = [
    // Left cluster
    { cx: 42,  angle:  0.00, c: '#e74c3c', letter: 'A' },
    { cx: 76,  angle:  0.18, c: '#f1c40f', letter: 'B' },
    { cx: 108, angle: -0.12, c: '#3498db', letter: 'C' },
    { cx: 64,  angle:  0.05, c: '#2ecc71', letter: '1', stackOn: 1 }, // stacked on B
    { cx: 148, angle:  0.32, c: '#9b59b6', letter: '?' },
    { cx: 178, angle: -0.25, c: '#e67e22', letter: '2' },
    // Right cluster
    { cx: W - 50,  angle: -0.08, c: '#1abc9c', letter: 'D' },
    { cx: W - 82,  angle:  0.20, c: '#e74c3c', letter: 'E' },
    { cx: W - 114, angle: -0.15, c: '#f1c40f', letter: '3' },
    { cx: W - 82,  angle:  0.04, c: '#3498db', letter: 'F', stackOn: 7 }, // stacked on E
    { cx: W - 148, angle:  0.28, c: '#e67e22', letter: '★' },
    { cx: W - 176, angle: -0.22, c: '#2ecc71', letter: '4' },
  ];

  const BS = 30; // block size
  blockDefs.forEach((b, idx) => {
    // Stacked blocks sit on top of the block they stack on; others sit on ground
    const groundY = b.stackOn !== undefined
      ? GROUND - BS - BS  // one block height above ground
      : GROUND - BS;      // sitting on ground
    ctx.save();
    ctx.translate(b.cx, groundY + BS / 2);
    ctx.rotate(b.angle);
    // Block face
    ctx.fillStyle = b.c;
    ctx.fillRect(-BS/2, -BS/2, BS, BS);
    // Top edge highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-BS/2, -BS/2, BS, 4);
    // Left edge highlight
    ctx.fillRect(-BS/2, -BS/2, 4, BS);
    // Bottom/right shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(-BS/2, BS/2 - 4, BS, 4);
    ctx.fillRect(BS/2 - 4, -BS/2, 4, BS);
    // Border
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(-BS/2, -BS/2, BS, BS);
    // Letter
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
    ctx.fillText(b.letter, 0, 5);
    ctx.restore();
  });

  // Wall baseboard
  ctx.fillStyle = '#c8973c'; ctx.fillRect(0, GROUND - 10, W, 10);

  // Colourful rug (floor)
  const rug = ctx.createLinearGradient(0, GROUND, 0, H);
  rug.addColorStop(0, '#c0392b'); rug.addColorStop(1, '#922b21');
  ctx.fillStyle = rug; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4;
  ctx.strokeRect(18, GROUND + 4, W - 36, H - GROUND - 8);
  ctx.strokeStyle = 'rgba(241,196,15,0.2)'; ctx.lineWidth = 1;
  for (let rx = 0; rx < W; rx += 44) {
    ctx.beginPath(); ctx.moveTo(rx, GROUND); ctx.lineTo(rx + 22, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx + 22, GROUND); ctx.lineTo(rx, H); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0, GROUND, W, 3);
}

// ---- Background: Pillow Fort ----------------------------------------
function drawBgPillowFort() {
  // === AMBIENT BACKGROUND ===
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#140700');
  bg.addColorStop(0.5, '#271100');
  bg.addColorStop(1, '#180900');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Warm lamp glow from centre (flashlight inside the fort)
  const lampGlow = ctx.createRadialGradient(W/2, GROUND * 0.62, 0, W/2, GROUND * 0.62, 420);
  lampGlow.addColorStop(0,   'rgba(255,155,35,0.28)');
  lampGlow.addColorStop(0.5, 'rgba(255,100,15,0.10)');
  lampGlow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = lampGlow; ctx.fillRect(0, 0, W, H);

  // === SOFAS (fort support structure, visible on each side) ===
  function drawSofa(isLeft) {
    const sw = 160, sh = 72;
    const x  = isLeft ? -30 : W - sw + 30;
    const sy = GROUND - sh;
    // Body
    ctx.fillStyle = '#4e2208';
    ctx.beginPath(); ctx.roundRect(x, sy, sw, sh, 7); ctx.fill();
    // Cushions
    ctx.fillStyle = '#60290a';
    ctx.beginPath(); ctx.roundRect(x + 7,      sy + 10, sw/2 - 11, sh - 18, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + sw/2 + 4, sy + 10, sw/2 - 11, sh - 18, 5); ctx.fill();
    // Cushion highlight
    ctx.fillStyle = 'rgba(255,170,60,0.07)';
    ctx.beginPath(); ctx.roundRect(x + 7,      sy + 10, sw/2 - 11, 14, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + sw/2 + 4, sy + 10, sw/2 - 11, 14, 3); ctx.fill();
    // Back rest
    ctx.fillStyle = '#3e1a06';
    ctx.beginPath(); ctx.roundRect(x, sy - 44, sw, 46, [7,7,0,0]); ctx.fill();
    // Arms (tall, support the blanket draping over them)
    ctx.fillStyle = '#351506';
    ctx.beginPath(); ctx.roundRect(x - 12, sy - 60, 20, sh + 60, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + sw - 8, sy - 60, 20, sh + 60, 5); ctx.fill();
    // Back highlight
    ctx.fillStyle = 'rgba(255,170,60,0.06)';
    ctx.fillRect(x + 10, sy - 42, sw - 20, 16);
  }
  drawSofa(true);
  drawSofa(false);

  // === WALL BLANKETS (hang from sofa arms down to ground on each side) ===
  function drawWallBlanket(isLeft) {
    const bw = 130;
    const x  = isLeft ? 0 : W - bw;
    const lean = isLeft ? 25 : -25; // natural drape lean toward centre
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + bw, 0);
    ctx.lineTo(x + bw + lean, GROUND + 5);
    ctx.lineTo(x + lean * 0.35, GROUND + 5);
    ctx.closePath();
    const col = isLeft ? '#5e2280' : '#7a1a10';
    ctx.fillStyle = col; ctx.fill();
    // Stripe pattern (running with the drape direction)
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = isLeft ? '#d0a0f0' : '#f0b090';
    for (let si = 12; si < bw; si += 22) {
      ctx.beginPath();
      ctx.moveTo(x + si, 0);         ctx.lineTo(x + si + 10, 0);
      ctx.lineTo(x + si + 10 + lean, GROUND + 5);
      ctx.lineTo(x + si + lean,      GROUND + 5);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Vertical crease shadows
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    for (let ci = 28; ci < bw; ci += 38) {
      ctx.beginPath();
      ctx.moveTo(x + ci, 0);
      ctx.lineTo(x + ci + lean * 0.75, GROUND * 0.65);
      ctx.stroke();
    }
    // Inner edge highlight
    ctx.strokeStyle = 'rgba(255,200,120,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + bw, 0);
    ctx.lineTo(x + bw + lean, GROUND + 5);
    ctx.stroke();
    ctx.restore();
  }
  drawWallBlanket(true);
  drawWallBlanket(false);

  // === CEILING BLANKET (main drape, sags in the middle) ===
  function drawCeilingBlanket(anchorY, sagAmt, baseCol, plaidCol) {
    const midY = anchorY + sagAmt;
    ctx.save();
    // Clip to the blanket shape: top of canvas down to the sagging curve
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W, 0);
    ctx.lineTo(W, anchorY);
    ctx.bezierCurveTo(W * 0.72, midY, W * 0.28, midY, 0, anchorY);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = baseCol;
    ctx.fillRect(0, 0, W, midY + 5);
    // Plaid horizontal stripes
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = plaidCol;
    for (let py = 0; py < midY + 5; py += 20) { ctx.fillRect(0, py, W, 9); }
    // Plaid vertical stripes
    for (let px = 0; px < W; px += 20) { ctx.fillRect(px, 0, 9, midY + 5); }
    ctx.globalAlpha = 1;
    // Fabric crease lines (converging toward sag centre)
    ctx.strokeStyle = 'rgba(0,0,0,0.14)'; ctx.lineWidth = 2.5;
    for (let fx = 50; fx < W; fx += 75) {
      const prog = fx / W;
      const botY  = anchorY + sagAmt * 4 * prog * (1 - prog);
      ctx.beginPath(); ctx.moveTo(fx, 0);
      ctx.quadraticCurveTo(fx + 8, botY * 0.55, fx - 6, botY);
      ctx.stroke();
    }
    // Sagging bottom edge catching light
    ctx.strokeStyle = 'rgba(255,210,140,0.22)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, anchorY);
    ctx.bezierCurveTo(W * 0.28, midY, W * 0.72, midY, W, anchorY);
    ctx.stroke();
    ctx.restore();
  }
  // Primary blanket (deep red plaid)
  drawCeilingBlanket(28, 88, '#821c1c', '#f0d09a');
  // Overlapping secondary blanket (navy, slightly offset left)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W * 0.65, 0);
  ctx.lineTo(W * 0.62, 22);
  ctx.bezierCurveTo(W * 0.42, 82, W * 0.14, 68, 0, 20);
  ctx.closePath();
  ctx.fillStyle = '#1a2e60'; ctx.fill();
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#8ab4e8';
  for (let py = 0; py < 85; py += 18) { ctx.fillRect(0, py, W * 0.65, 8); }
  for (let px = 0; px < W * 0.65; px += 18) { ctx.fillRect(px, 0, 8, 85); }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,210,140,0.18)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, 20);
  ctx.bezierCurveTo(W * 0.14, 68, W * 0.42, 82, W * 0.62, 22);
  ctx.stroke();
  ctx.restore();

  // === FLUFFY PILLOWS stacked along each side ===
  function drawPillow(cx, cy, pw, ph, col, angle) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(angle);
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath(); ctx.ellipse(6, 7, pw/2 + 2, ph/2 - 2, 0, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(-pw/2, -ph/2, pw, ph, pw * 0.22); ctx.fill();
    // Top-left soft highlight
    const hi = ctx.createRadialGradient(-pw*0.18, -ph*0.2, 0, -pw*0.18, -ph*0.2, pw*0.55);
    hi.addColorStop(0, 'rgba(255,255,255,0.28)');
    hi.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hi;
    ctx.beginPath(); ctx.roundRect(-pw/2, -ph/2, pw, ph, pw * 0.22); ctx.fill();
    // Seam cross
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-pw*0.28, 0); ctx.lineTo(pw*0.28, 0);
    ctx.moveTo(0, -ph*0.28); ctx.lineTo(0,  ph*0.28);
    ctx.stroke();
    // Centre button
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Left stack (4 pillows, increasingly smaller going up)
  drawPillow( 68, GROUND -  26, 118, 60, '#7b2abf',  0.04);
  drawPillow( 60, GROUND -  82,  98, 52, '#1f6fa8', -0.07);
  drawPillow( 70, GROUND - 132,  84, 46, '#c0392b',  0.09);
  drawPillow( 55, GROUND - 176,  70, 40, '#d68910', -0.05);
  // Right stack
  drawPillow(W - 68, GROUND -  26, 118, 60, '#1e8449', -0.04);
  drawPillow(W - 60, GROUND -  82,  98, 52, '#884ea0',  0.07);
  drawPillow(W - 70, GROUND - 132,  84, 46, '#ca6f1e', -0.09);
  drawPillow(W - 55, GROUND - 176,  70, 40, '#148f77',  0.05);

  // === WARM RUG FLOOR ===
  const rugGrad = ctx.createLinearGradient(0, GROUND, 0, H);
  rugGrad.addColorStop(0, '#3d1500');
  rugGrad.addColorStop(1, '#200b00');
  ctx.fillStyle = rugGrad; ctx.fillRect(0, GROUND + 3, W, H - GROUND);
  // Striped rug pattern
  const rugCols = ['rgba(100,20,20,0.55)','rgba(30,15,70,0.45)','rgba(20,55,30,0.45)'];
  const sW = W / 13;
  for (let rs = 0; rs < 13; rs++) {
    ctx.fillStyle = rugCols[rs % rugCols.length];
    ctx.fillRect(rs * sW, GROUND + 3, sW, H - GROUND - 3);
  }
  // Rug border (double line)
  ctx.strokeStyle = 'rgba(210,165,65,0.4)'; ctx.lineWidth = 4;
  ctx.strokeRect(3, GROUND + 3, W - 6, H - GROUND - 7);
  ctx.strokeStyle = 'rgba(210,165,65,0.2)'; ctx.lineWidth = 2;
  ctx.strokeRect(10, GROUND + 8, W - 20, H - GROUND - 17);

  // Ground shadow line
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, GROUND, W, 3);

  // === STRING LIGHTS (hanging from the ceiling blanket) ===
  const bulbCols = ['#f1c40f','#e74c3c','#3498db','#2ecc71','#e67e22','#9b59b6'];
  const NB = 18;
  const wireX = i => 28 + (i / (NB - 1)) * (W - 56);
  // Natural catenary sag
  const wireY = i => { const t = i / (NB - 1); return 95 + Math.sin(t * Math.PI) * 26 + Math.sin(t * Math.PI * 4) * 3; };
  // Wire
  ctx.strokeStyle = 'rgba(55,38,18,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let li = 0; li < NB; li++) {
    li === 0 ? ctx.moveTo(wireX(li), wireY(li)) : ctx.lineTo(wireX(li), wireY(li));
  }
  ctx.stroke();
  // Bulbs
  for (let li = 0; li < NB; li++) {
    const lx = wireX(li), ly = wireY(li);
    const bc = bulbCols[li % bulbCols.length];
    ctx.save();
    ctx.shadowBlur = 22; ctx.shadowColor = bc;
    ctx.fillStyle = bc;
    ctx.beginPath(); ctx.ellipse(lx, ly + 9, 4.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Socket cap
    ctx.fillStyle = 'rgba(45,30,12,0.9)';
    ctx.fillRect(lx - 3.5, ly + 2, 7, 4);
    ctx.restore();
  }
}

// ---- Background: Playground -----------------------------------------
function drawBgPlayground() {
  // Golden-hour sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0,    '#1a1a4e');
  sky.addColorStop(0.38, '#7b2d8b');
  sky.addColorStop(0.72, '#e8723a');
  sky.addColorStop(1,    '#f5c842');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Sun
  ctx.save(); ctx.shadowBlur = 45; ctx.shadowColor = '#f5d442';
  ctx.fillStyle = '#f5d442';
  ctx.beginPath(); ctx.arc(750, GROUND - 44, 36, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const sunGlow = ctx.createRadialGradient(750, GROUND - 44, 32, 750, GROUND - 44, 110);
  sunGlow.addColorStop(0, 'rgba(245,210,66,0.28)'); sunGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sunGlow; ctx.fillRect(620, GROUND - 180, 280, 180);

  // Warm clouds
  [[115,78],[340,58],[590,88],[210,135]].forEach(([cx,cy]) => {
    ctx.fillStyle = 'rgba(255,195,110,0.52)';
    ctx.beginPath();
    ctx.arc(cx,     cy,    28, 0, Math.PI*2);
    ctx.arc(cx+28,  cy-10, 20, 0, Math.PI*2);
    ctx.arc(cx+52,  cy,    24, 0, Math.PI*2);
    ctx.fill();
  });

  // Background trees — left
  [0, 1, 2].forEach(i => {
    const tx = 38 + i * 32, th = 55 + i * 12;
    ctx.fillStyle = '#2d5a1b';
    ctx.beginPath();
    ctx.moveTo(tx - 20, GROUND - th + 30);
    ctx.lineTo(tx + 20, GROUND - th + 30);
    ctx.lineTo(tx, GROUND - th - 30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a4a1e'; ctx.fillRect(tx - 5, GROUND - th + 28, 10, th - 28);
  });

  // Swing set — right background
  const swX = 690;
  ctx.strokeStyle = '#999'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(swX - 48, GROUND); ctx.lineTo(swX - 28, GROUND - 145);
  ctx.lineTo(swX + 28, GROUND - 145); ctx.lineTo(swX + 48, GROUND);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(swX - 28, GROUND - 145); ctx.lineTo(swX + 28, GROUND - 145); ctx.stroke();
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(swX - 8, GROUND - 145); ctx.lineTo(swX - 12, GROUND - 82); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(swX + 8, GROUND - 145); ctx.lineTo(swX + 12, GROUND - 82); ctx.stroke();
  ctx.fillStyle = '#5d3a1a'; ctx.fillRect(swX - 16, GROUND - 84, 32, 6);

  // Slide — left background
  const slX = 205;
  ctx.fillStyle = '#c0392b'; ctx.fillRect(slX - 7, GROUND - 125, 14, 125);
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(slX - 4, GROUND - 125); ctx.lineTo(slX + 58, GROUND - 28);
  ctx.lineTo(slX + 68, GROUND - 28); ctx.lineTo(slX + 6, GROUND - 125);
  ctx.closePath(); ctx.fill();
  // Slide edge rails
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(slX - 4, GROUND - 125); ctx.lineTo(slX + 58, GROUND - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(slX + 6, GROUND - 125); ctx.lineTo(slX + 68, GROUND - 28); ctx.stroke();

  // Grass
  const grass = ctx.createLinearGradient(0, GROUND, 0, H);
  grass.addColorStop(0, '#4a9c2a'); grass.addColorStop(1, '#2e6018');
  ctx.fillStyle = grass; ctx.fillRect(0, GROUND, W, H - GROUND);

  // Grass tufts
  ctx.strokeStyle = 'rgba(100,210,55,0.28)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let gx = 8; gx < W; gx += 24) {
    ctx.beginPath(); ctx.moveTo(gx, GROUND); ctx.quadraticCurveTo(gx + 5, GROUND - 9, gx + 10, GROUND); ctx.stroke();
  }

  // Sunset ground glow
  const gGlow = ctx.createLinearGradient(0, GROUND, 0, GROUND + 22);
  gGlow.addColorStop(0, 'rgba(245,175,45,0.32)'); gGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = gGlow; ctx.fillRect(0, GROUND, W, 22);
}

// ---- Background: Bunk Bed -------------------------------------------
function drawBgBunkBed() {
  const POST_W   = 32;   // width of bed frame posts
  const TOP_Y    = 158;  // underside of top bunk / ceiling of bottom bunk
  const GUARD_TOP = 82;  // top bar of guard rail
  const GUARD_BOT = 116; // bottom bar of guard rail
  const WOOD_MID   = '#8B5A2B';
  const WOOD_DARK  = '#5C3317';
  const WOOD_LIGHT = '#A8703F';

  // === BEDROOM WALL ===
  const wall = ctx.createLinearGradient(0, 0, 0, H);
  wall.addColorStop(0, '#d4e4f0'); wall.addColorStop(1, '#bfd2e6');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
  // Soft wallpaper stripes
  ctx.fillStyle = 'rgba(185,208,228,0.45)';
  for (let wx = 0; wx < W; wx += 38) { ctx.fillRect(wx, 0, 16, H); }
  // Star & moon motifs
  ctx.fillStyle = 'rgba(140,175,210,0.38)'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
  for (let mx = 60; mx < W - 60; mx += 112) {
    for (let my = 28; my < H; my += 82) {
      ctx.fillText((my % 164 < 82) ? '★' : '☽', mx + (my % 22) - 8, my);
    }
  }

  // === INSIDE BOTTOM BUNK — darker back wall ===
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fillRect(POST_W, TOP_Y + 20, W - POST_W * 2, GROUND - TOP_Y - 20);

  // === TOP BUNK BEDDING (visible above the guard rail) ===
  // Sheet covering the mattress surface
  ctx.fillStyle = '#f0e8d8';
  ctx.fillRect(POST_W, 18, W - POST_W * 2, GUARD_BOT + 6);
  // Blue comforter — spread across, slightly bunched toward foot (right)
  ctx.fillStyle = '#2e6fa8';
  ctx.beginPath();
  ctx.moveTo(POST_W + 8, GUARD_BOT + 4);
  ctx.lineTo(W * 0.80, GUARD_BOT + 4);
  ctx.lineTo(W * 0.82, GUARD_BOT - 66);
  ctx.bezierCurveTo(W * 0.78, GUARD_BOT - 72, W * 0.74, GUARD_BOT - 64, W * 0.71, GUARD_BOT - 67);
  ctx.lineTo(POST_W + 8, GUARD_BOT - 64);
  ctx.closePath(); ctx.fill();
  // Comforter highlight & quilting
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.beginPath();
  ctx.moveTo(POST_W + 8, GUARD_BOT + 2);
  ctx.lineTo(W * 0.80, GUARD_BOT + 2);
  ctx.lineTo(W * 0.82, GUARD_BOT - 48);
  ctx.lineTo(POST_W + 8, GUARD_BOT - 46);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(100,155,215,0.38)'; ctx.lineWidth = 1.5;
  for (let qx = POST_W + 55; qx < W * 0.80; qx += 68) {
    ctx.beginPath(); ctx.moveTo(qx, GUARD_BOT + 4); ctx.lineTo(qx - 4, GUARD_BOT - 65); ctx.stroke();
  }

  // Pillows at head end (left)
  function drawTopPillow(cx, cy, pw, ph, col, ang) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(4, 5, pw/2, ph/2-2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(-pw/2, -ph/2, pw, ph, pw*0.22); ctx.fill();
    const hi = ctx.createRadialGradient(-pw*0.15, -ph*0.2, 0, 0, 0, pw*0.6);
    hi.addColorStop(0, 'rgba(255,255,255,0.3)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hi;
    ctx.beginPath(); ctx.roundRect(-pw/2, -ph/2, pw, ph, pw*0.22); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-pw*0.28, 0); ctx.lineTo(pw*0.28, 0);
    ctx.moveTo(0, -ph*0.26); ctx.lineTo(0, ph*0.26);
    ctx.stroke();
    ctx.restore();
  }
  drawTopPillow(POST_W + 78, GUARD_BOT - 36, 124, 52, '#f5f0e8', -0.04);
  drawTopPillow(POST_W + 82, GUARD_BOT - 90, 112, 48, '#e8dece',  0.05);

  // === STUFFED ANIMALS peeking over guard rail ===
  function drawPeekBear(x, col) {
    const hy = GUARD_BOT - 6;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x - 15, hy - 22, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 15, hy - 22, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e0a888';
    ctx.beginPath(); ctx.arc(x - 15, hy - 22, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 15, hy - 22, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, hy, 25, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x - 8, hy - 9, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, hy - 9, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - 7, hy - 10, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 9, hy - 10, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3020';
    ctx.beginPath(); ctx.ellipse(x, hy - 1, 5, 4, 0, 0, Math.PI*2); ctx.fill();
  }
  function drawPeekBunny(x, col) {
    const hy = GUARD_BOT - 6;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x - 11, hy - 46, 7, 23, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 11, hy - 44, 7, 23,  0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0b8b8';
    ctx.beginPath(); ctx.ellipse(x - 11, hy - 46, 4, 16, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 11, hy - 44, 4, 16,  0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, hy, 21, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x - 7, hy - 8, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 7, hy - 8, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - 6, hy - 9, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, hy - 9, 1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e88898';
    ctx.beginPath(); ctx.arc(x, hy - 3, 3, 0, Math.PI*2); ctx.fill();
  }
  drawPeekBear(  W * 0.58, '#c8a882');
  drawPeekBunny( W * 0.73, '#f0f0f4');

  // === GUARD RAIL ===
  // Top bar
  ctx.fillStyle = WOOD_MID;
  ctx.beginPath(); ctx.roundRect(POST_W, GUARD_TOP, W - POST_W * 2, 11, 3); ctx.fill();
  ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(POST_W + 2, GUARD_TOP, W - POST_W * 2 - 4, 3);
  // Bottom bar
  ctx.fillStyle = WOOD_MID;
  ctx.beginPath(); ctx.roundRect(POST_W, GUARD_BOT, W - POST_W * 2, 11, 3); ctx.fill();
  ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(POST_W + 2, GUARD_BOT, W - POST_W * 2 - 4, 3);
  // Balusters
  for (let bx = POST_W + 42; bx < W - POST_W - 24; bx += 54) {
    ctx.fillStyle = WOOD_MID;
    ctx.beginPath(); ctx.roundRect(bx, GUARD_TOP, 9, GUARD_BOT - GUARD_TOP + 11, 2); ctx.fill();
    ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(bx, GUARD_TOP + 1, 3, GUARD_BOT - GUARD_TOP + 9);
  }

  // === UNDERSIDE OF TOP BUNK (wooden ceiling board + slats) ===
  ctx.fillStyle = WOOD_DARK;
  ctx.fillRect(POST_W, TOP_Y, W - POST_W * 2, 20);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
  for (let sx = POST_W + 72; sx < W - POST_W; sx += 82) {
    ctx.beginPath(); ctx.moveTo(sx, TOP_Y); ctx.lineTo(sx, TOP_Y + 20); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(POST_W, TOP_Y + 20, W - POST_W * 2, 4);

  // === BED FRAME POSTS (full height) ===
  // Left
  ctx.fillStyle = WOOD_MID; ctx.fillRect(0, 0, POST_W, H);
  ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(POST_W - 8, 0, 8, H);
  ctx.fillStyle = WOOD_DARK;  ctx.fillRect(0, 0, 5, H);
  for (let gy = 110; gy < H; gy += 145) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(0, gy, POST_W, 5);
  }
  // Right
  ctx.fillStyle = WOOD_MID; ctx.fillRect(W - POST_W, 0, POST_W, H);
  ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(W - POST_W, 0, 8, H);
  ctx.fillStyle = WOOD_DARK;  ctx.fillRect(W - 5, 0, 5, H);
  for (let gy = 110; gy < H; gy += 145) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(W - POST_W, gy, POST_W, 5);
  }

  // === HEADBOARD (decorative arch, left post top) ===
  ctx.fillStyle = WOOD_MID;
  ctx.beginPath(); ctx.roundRect(-4, 0, POST_W + 18, 72, [0, 0, 8, 8]); ctx.fill();
  ctx.beginPath(); ctx.arc(POST_W / 2 + 3, 6, POST_W / 2 + 9, Math.PI, 0); ctx.fill();
  ctx.fillStyle = WOOD_LIGHT;
  ctx.beginPath();
  ctx.arc(POST_W / 2 + 3, 6, POST_W / 2 + 9, Math.PI, 0);
  ctx.arc(POST_W / 2 + 3, 6, POST_W / 2 + 4, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = WOOD_LIGHT; ctx.fillRect(-2, 65, POST_W + 14, 4);

  // === LADDER (right side, inside the post) ===
  const ladX = W - POST_W - 32;
  ctx.fillStyle = WOOD_MID;
  ctx.beginPath(); ctx.roundRect(ladX,      TOP_Y + 20, 9, GROUND - TOP_Y - 16, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(ladX + 22, TOP_Y + 20, 9, GROUND - TOP_Y - 16, 3); ctx.fill();
  for (let ry = TOP_Y + 42; ry < GROUND - 8; ry += 50) {
    ctx.fillStyle = WOOD_LIGHT;
    ctx.beginPath(); ctx.roundRect(ladX, ry, 31, 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(ladX, ry + 6, 31, 3);
  }

  // === BOTTOM BUNK MATTRESS (fight floor) ===
  // Blue fitted sheet surface (the ground characters stand on)
  ctx.fillStyle = '#7aafc8';
  ctx.fillRect(POST_W, GROUND - 4, W - POST_W * 2, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (let sx = POST_W + 12; sx < W - POST_W; sx += 38) {
    ctx.fillRect(sx, GROUND - 4, 18, 4);
  }
  // Mattress front face
  ctx.fillStyle = '#cfc3ae'; ctx.fillRect(POST_W, GROUND, W - POST_W * 2, 20);
  ctx.fillStyle = '#b8ae9a'; ctx.fillRect(POST_W, GROUND + 16, W - POST_W * 2, 4);

  // === BED BASE FRAME & UNDER-BED ===
  ctx.fillStyle = WOOD_DARK; ctx.fillRect(POST_W, GROUND + 20, W - POST_W * 2, 10);
  const underBed = ctx.createLinearGradient(0, GROUND + 30, 0, H);
  underBed.addColorStop(0, '#160e06'); underBed.addColorStop(1, '#0a0704');
  ctx.fillStyle = underBed; ctx.fillRect(0, GROUND + 30, W, H - GROUND - 30);

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(POST_W, GROUND, W - POST_W * 2, 3);
}

function healthColor(pct) {
  if (pct > 0.5) return '#2ecc71';
  if (pct > 0.25) return '#f39c12';
  return '#e74c3c';
}

function drawHUD(p1, p2, round, timer, p1wins, p2wins) {
  const bw = 310, bh = 26, by = 18, pad = 22;

  // Health bars
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(pad, by, bw, bh);
  ctx.fillRect(W - pad - bw, by, bw, bh);

  const p1p = p1.health / p1.maxHealth;
  const p2p = p2.health / p2.maxHealth;

  ctx.fillStyle = healthColor(p1p);
  ctx.fillRect(pad, by, bw * p1p, bh);

  // P2 bar fills from right
  ctx.fillStyle = healthColor(p2p);
  ctx.fillRect(W - pad - bw * p2p, by, bw * p2p, bh);

  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.strokeRect(pad, by, bw, bh);
  ctx.strokeRect(W - pad - bw, by, bw, bh);

  // Names — dark outline keeps text readable on any background
  ctx.font = 'bold 13px Arial';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineJoin = 'round';
  ctx.textAlign = 'left';
  ctx.strokeText(p1.char.name, pad + 5, by - 4);
  ctx.textAlign = 'right';
  ctx.strokeText(p2.char.name, W - pad - 5, by - 4);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(p1.char.name, pad + 5, by - 4);
  ctx.textAlign = 'right';
  ctx.fillText(p2.char.name, W - pad - 5, by - 4);

  // Special meters — thin bar directly below each health bar
  const smh = 5, smy = by + bh + 3;
  const pulse = 0.55 + Math.abs(Math.sin(Date.now() * 0.006)) * 0.45;

  // P1 special meter (fills left to right)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(pad, smy, bw, smh);
  if (p1.specialMeter >= 100) {
    ctx.save();
    ctx.shadowBlur = 12 + pulse * 14; ctx.shadowColor = '#f1c40f';
    ctx.fillStyle = `rgba(255,215,0,${0.75 + pulse * 0.25})`;
    ctx.fillRect(pad, smy, bw, smh);
    ctx.restore();
  } else {
    const g1 = ctx.createLinearGradient(pad, 0, pad + bw, 0);
    g1.addColorStop(0, '#f1c40f'); g1.addColorStop(1, '#e67e22');
    ctx.fillStyle = g1;
    ctx.fillRect(pad, smy, bw * p1.specialMeter / 100, smh);
  }

  // P2 special meter (fills right to left)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - pad - bw, smy, bw, smh);
  if (p2.specialMeter >= 100) {
    ctx.save();
    ctx.shadowBlur = 12 + pulse * 14; ctx.shadowColor = '#f1c40f';
    ctx.fillStyle = `rgba(255,215,0,${0.75 + pulse * 0.25})`;
    ctx.fillRect(W - pad - bw, smy, bw, smh);
    ctx.restore();
  } else {
    const g2 = ctx.createLinearGradient(W - pad - bw, 0, W - pad, 0);
    g2.addColorStop(0, '#e67e22'); g2.addColorStop(1, '#f1c40f');
    ctx.fillStyle = g2;
    ctx.fillRect(W - pad - bw * p2.specialMeter / 100, smy, bw * p2.specialMeter / 100, smh);
  }

  // Win stars — shifted down to sit below the special meter
  for (let w = 0; w < p1wins; w++) {
    ctx.fillStyle = '#f1c40f';
    ctx.textAlign = 'center';
    drawStarShape(pad + 20 + w * 22, smy + smh + 9, 7, 5);
  }
  for (let w = 0; w < p2wins; w++) {
    ctx.fillStyle = '#f1c40f';
    drawStarShape(W - pad - 20 - w * 22, smy + smh + 9, 7, 5);
  }

  // Timer
  const timerNum = Math.ceil(timer);
  ctx.fillStyle = timerNum <= 10 ? '#e74c3c' : '#fff';
  ctx.font = `bold 38px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText(timerNum, W / 2, 50);

  // Round label
  ctx.fillStyle = '#aaa'; ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`ROUND ${round}`, W / 2, 17);

  // Controls hint — bottom right corner
  ctx.fillStyle = 'rgba(180,180,180,0.55)'; ctx.font = '11px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('P — Pause   ·   Esc — Quit', W - 10, H - 8);
}

// ---- Screens --------------------------------------------------------
function drawCharSelect(chars, hovered, pickedChar, phase) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0f0c29');
  bg.addColorStop(1, '#1a0547');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Title
  ctx.shadowBlur = 18; ctx.shadowColor = '#ff69b4';
  ctx.fillStyle = '#ff69b4'; ctx.font = 'bold 44px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('STUFFIE FIGHTER', W / 2, 58);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial';
  ctx.fillText(phase === 'player' ? '— SELECT YOUR FIGHTER —' : '— SELECT YOUR OPPONENT —', W / 2, 85);

  const cols = 4, cW = 200, cH = 160;
  const gx = W / 2 - (cols * cW + (cols - 1) * 8) / 2;
  const gy = 100;

  chars.forEach((ch, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gx + col * (cW + 8) + cW / 2;
    const cy = gy + row * (cH + 8) + cH / 2;

    const isHov = i === hovered;
    const isTaken = phase === 'opp' && pickedChar && ch.id === pickedChar.id;

    ctx.fillStyle = isTaken ? 'rgba(0,80,0,0.45)' : isHov ? 'rgba(255,105,180,0.22)' : 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = isTaken ? '#00aa00' : isHov ? '#ff69b4' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = isHov ? 3 : 1;
    if (isHov) { ctx.shadowBlur = 16; ctx.shadowColor = '#ff69b4'; }
    roundRect(cx - cW/2, cy - cH/2, cW, cH, 12);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    // Character preview
    ctx.save();
    // Clip to card
    roundRect(cx - cW/2 + 2, cy - cH/2 + 2, cW - 4, cH - 4, 10);
    ctx.clip();
    ctx.translate(cx, cy + 14);
    ctx.scale(0.68, 0.68);
    drawChar(ch.id, 0, 0, 1, 'idle', Date.now() * 0.04 + i * 40, 1, false);
    ctx.restore();

    if (isTaken) {
      ctx.fillStyle = 'rgba(0,120,0,0.55)';
      roundRect(cx - cW/2, cy - cH/2, cW, cH, 12);
      ctx.fill();
      ctx.fillStyle = '#aaffaa'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
      ctx.fillText('YOU', cx, cy + 6);
    }

    // Coming soon overlay for preview characters
    if (ch.preview) {
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      roundRect(cx - cW/2, cy - cH/2, cW, cH, 12);
      ctx.fill();
      // Badge
      ctx.save();
      ctx.translate(cx, cy - 14);
      ctx.rotate(-0.12);
      const bW = 118, bH = 28;
      ctx.fillStyle = '#ff69b4';
      roundRect(-bW/2, -bH/2, bW, bH, 6);
      ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
      ctx.fillText('COMING SOON', 0, 5);
      ctx.restore();
    }

    // Name
    ctx.fillStyle = ch.preview ? '#888' : isHov ? '#ff69b4' : '#fff';
    ctx.font = `bold ${isHov ? 15 : 13}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(ch.name, cx, cy + cH/2 - 53);

    // Stat bars — bold label LEFT, colored bar RIGHT
    const statDefs = [
      { label: 'Speed',   val: ch.stats.spd, color: '#2ecc71' },
      { label: 'Power',   val: ch.stats.pow, color: '#e74c3c' },
      { label: 'Defense', val: ch.stats.def, color: '#3498db' },
    ];
    const barX = cx - 4, barMaxW = 72, barH = 9, rowH = 14;
    const statTop = cy + cH/2 - 36;
    statDefs.forEach((s, si) => {
      const sy = statTop + si * rowH;
      // Label — bold, right-aligned, ends just before the bar
      ctx.fillStyle = '#ddd'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'right';
      ctx.fillText(s.label, barX - 5, sy + barH - 1);
      // Bar background
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(barX, sy, barMaxW, barH);
      // Bar fill
      ctx.fillStyle = s.color;
      ctx.fillRect(barX, sy, barMaxW * s.val / 10, barH);
      // Border
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.5;
      ctx.strokeRect(barX, sy, barMaxW, barH);
    });
  });

  // Bottom instruction bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, H - 36, W, 36);
  ctx.fillStyle = '#888'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
  if (phase === 'player') {
    ctx.fillText('Arrow Keys: Navigate   |   Enter / Z: Select Fighter', W/2, H - 13);
  } else {
    ctx.fillText('Arrow Keys: Navigate   |   Enter / Z: Confirm Opponent   |   Esc: Change Fighter', W/2, H - 13);
  }
}

function drawFightAnnounce(msg, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 25; ctx.shadowColor = '#ff69b4';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 70px Arial'; ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, H / 2 + 20);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawRoundEnd(result, charNames, p1wins, p2wins) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);

  const msgs = {
    p1_ko:   { top: 'K.O.!',    sub: `${charNames[0]} wins the round!`, col: '#2ecc71' },
    p2_ko:   { top: 'K.O.!',    sub: `${charNames[1]} wins the round!`, col: '#e74c3c' },
    p1_time: { top: 'TIME UP!', sub: `${charNames[0]} wins by health!`, col: '#2ecc71' },
    p2_time: { top: 'TIME UP!', sub: `${charNames[1]} wins by health!`, col: '#e74c3c' },
    draw:    { top: 'DRAW!',    sub: 'Both fighters are down!',          col: '#f39c12' }
  };
  const m = msgs[result] || msgs.draw;

  ctx.shadowBlur = 30; ctx.shadowColor = m.col;
  ctx.fillStyle = m.col; ctx.font = 'bold 78px Arial'; ctx.textAlign = 'center';
  ctx.fillText(m.top, W/2, H/2 - 10);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial';
  ctx.fillText(m.sub, W/2, H/2 + 50);

  ctx.fillStyle = '#aaa'; ctx.font = '14px Arial';
  ctx.fillText(`You: ${p1wins} win(s)   ·   Opponent: ${p2wins} win(s)`, W/2, H/2 + 86);
  ctx.fillText('Press Enter to continue', W/2, H/2 + 114);
}

function drawGameOver(playerWon, p1char, p2char, p1wins, p2wins) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, playerWon ? '#082c10' : '#2c0808');
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const col = playerWon ? '#2ecc71' : '#e74c3c';
  const winner = playerWon ? p1char : p2char;

  // Text in the top third — character fills the bottom
  ctx.shadowBlur = 35; ctx.shadowColor = col;
  ctx.fillStyle = col; ctx.font = 'bold 58px Arial'; ctx.textAlign = 'center';
  ctx.fillText(playerWon ? '★  VICTORY!  ★' : '✖  GAME OVER  ✖', W/2, 82);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
  ctx.fillText(`${winner.name} is the Stuffie Champion!`, W/2, 128);

  ctx.fillStyle = '#666'; ctx.font = '15px Arial';
  ctx.fillText('Press Enter or R to play again', W/2, 156);

  // Winner character — scaled up to fill the lower half and reduce gap below text
  ctx.save();
  ctx.translate(W/2, H);
  ctx.scale(2.3, 2.3);
  drawChar(winner.id, 0, 0, 1, 'idle', Date.now() * 0.04, 1, false);
  ctx.restore();
}

// ---- VS Confirmation Screen -----------------------------------------
function drawVSScreen(p1char, p2char, t, bgChoice) {
  // Draw the selected stage as a live background preview
  if      (bgChoice === 1) drawBgBunkBed();
  else if (bgChoice === 2) drawBgPillowFort();
  else if (bgChoice === 3) drawBgPlayground();
  else if (bgChoice === 4) drawBgToyRoom();
  else {
    // Random — no preview, just the dark VS screen gradient
    const rBg = ctx.createLinearGradient(0, 0, W, H);
    rBg.addColorStop(0,   '#1a0030');
    rBg.addColorStop(0.5, '#0d0019');
    rBg.addColorStop(1,   '#001a30');
    ctx.fillStyle = rBg; ctx.fillRect(0, 0, W, H);
  }

  // Dark veil over stage previews so the VS UI stays legible
  if (bgChoice !== 0) {
    ctx.fillStyle = 'rgba(5, 0, 20, 0.54)';
    ctx.fillRect(0, 0, W, H);
  }

  // Animated diagonal slash lines (subtle texture layer)
  ctx.save();
  ctx.globalAlpha = 0.05;
  for (let i = -5; i < 20; i++) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(i * 60 - 100, 0);
    ctx.lineTo(i * 60 + 100, H);
    ctx.stroke();
  }
  ctx.restore();

  // Left character (player) — faces right
  ctx.save();
  ctx.translate(195, GROUND + 30);
  ctx.scale(2.1, 2.1);
  drawChar(p1char.id, 0, 0, 1, 'idle', t * 0.04, 1, false);
  ctx.restore();

  // Right character (opponent) — faces left (mirrored)
  ctx.save();
  ctx.translate(705, GROUND + 30);
  ctx.scale(2.1, 2.1);
  drawChar(p2char.id, 0, 0, -1, 'idle', t * 0.04, 1, false);
  ctx.restore();

  // Player name plate (left)
  const nameBoxW = 250, nameBoxH = 36;
  const lx = 70, ly = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(lx, ly, nameBoxW, nameBoxH, 8); ctx.fill();
  ctx.strokeStyle = p1char.c1; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(lx, ly, nameBoxW, nameBoxH, 8); ctx.stroke();
  ctx.fillStyle = p1char.c1; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
  ctx.fillText(p1char.name, lx + nameBoxW / 2, ly + 25);

  // Opponent name plate (right)
  const rx = W - 70 - nameBoxW, ry = 48;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(rx, ry, nameBoxW, nameBoxH, 8); ctx.fill();
  ctx.strokeStyle = p2char.c1; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(rx, ry, nameBoxW, nameBoxH, 8); ctx.stroke();
  ctx.fillStyle = p2char.c1; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
  ctx.fillText(p2char.name, rx + nameBoxW / 2, ry + 25);

  // "VS" badge in the centre
  const pulse = 1 + 0.06 * Math.sin(t * 0.005);
  ctx.save();
  ctx.translate(W / 2, 200);
  ctx.scale(pulse, pulse);
  ctx.shadowBlur = 40; ctx.shadowColor = '#ff69b4';
  ctx.fillStyle = '#ff69b4'; ctx.font = 'bold 78px Arial'; ctx.textAlign = 'center';
  ctx.fillText('VS', 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();

  // "YOU" / "CPU" labels — placed below name plates, well above the stage picker
  ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('▼  YOU', 195, 115);
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('CPU  ▼', 705, 115);

  // ---- Stage select picker ----
  const BG_LABELS = ['Random', 'Bunk Bed', 'Pillow Fort', 'Playground', 'Toy Room'];
  const BG_COLORS = ['#aaaaaa', '#e8a84c', '#7b2abf', '#e8723a', '#8B5A2B'];
  const itemW = 118, itemH = 30, gap = 8;
  const totalW = BG_LABELS.length * itemW + (BG_LABELS.length - 1) * gap;
  const pickerX = W / 2 - totalW / 2;
  const pickerY = H - 72;

  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('— STAGE —', W / 2, pickerY - 8);

  BG_LABELS.forEach((label, i) => {
    const bx = pickerX + i * (itemW + gap);
    const isSel = bgChoice === i;
    ctx.fillStyle = isSel ? BG_COLORS[i] : 'rgba(255,255,255,0.07)';
    ctx.globalAlpha = isSel ? 0.9 : 0.75;
    ctx.beginPath(); ctx.roundRect(bx, pickerY, itemW, itemH, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = isSel ? BG_COLORS[i] : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isSel ? 2 : 1;
    if (isSel) { ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = BG_COLORS[i]; }
    ctx.beginPath(); ctx.roundRect(bx, pickerY, itemW, itemH, 5); ctx.stroke();
    if (isSel) ctx.restore();
    ctx.fillStyle = isSel ? '#fff' : 'rgba(255,255,255,0.6)';
    ctx.font = `${isSel ? 'bold ' : ''}11px Arial`; ctx.textAlign = 'center';
    ctx.fillText(label, bx + itemW / 2, pickerY + 19);
  });

  // Instruction strip
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H - 32, W, 32);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - 32); ctx.lineTo(W, H - 32); ctx.stroke();

  ctx.font = '13px Arial'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('◀ ▶  Stage   ·', W / 2 - 155, H - 11);
  ctx.fillStyle = '#2ecc71';
  ctx.fillText('Enter / Z  —  FIGHT!', W / 2, H - 11);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('·  Esc  —  Back', W / 2 + 155, H - 11);
}

// ---- Collision ------------------------------------------------------
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---- Game State -----------------------------------------------------
let gstate = 'char_select'; // char_select | opp_select | vs_confirm | fight | round_end | game_over
let paused = false;

let selectedPlayer = null;
let selectedOpponent = null;
let hovIdx = 0;
let bgChoice = 0; // 0=Random, 1=Bunk Bed, 2=Pillow Fort, 3=Playground, 4=Toy Room
let player = null;
let opponent = null;
let ai = null;
let roundNum = 1;
let roundTimer = 60;
let roundTimerAccum = 0;
let roundResult = null;
let roundEndTimer = 0;
let p1wins = 0, p2wins = 0;
let announceMsg = '';
let announceFade = 0;
let lastTs = 0;
let comboCount = 0;
let comboTimer = 0;
let currentBg = 0; // 0 = Toy Room, 1 = Pillow Fort, 2 = Playground, 3 = Bunk Bed

function startRound() {
  paused = false;
  player   = new Fighter(selectedPlayer,   180, 1);
  opponent = new Fighter(selectedOpponent, W - 180, -1);
  ai = new AI(opponent);
  roundTimer = 60;
  roundTimerAccum = 0;
  particles = [];
  announceMsg = `ROUND ${roundNum}`;
  announceFade = 1;
  comboCount = 0; comboTimer = 0;
}

function resolveRound(result) {
  roundResult = result;
  roundEndTimer = 200;
  gstate = 'round_end';
  if (result === 'p1_ko' || result === 'p1_time') {
    p1wins++;
    spawnParticles(player.x, player.y - 60, '#2ecc71', 20, 'star');
  } else if (result === 'p2_ko' || result === 'p2_time') {
    p2wins++;
    spawnParticles(opponent.x, opponent.y - 60, '#e74c3c', 16, 'star');
  }
}

function getPlayerInput() {
  const z     = keys['KeyZ'];
  const x     = keys['KeyX'];
  const shift = keys['ShiftLeft'] || keys['ShiftRight'];
  return {
    left:    keys['ArrowLeft']  || keys['KeyA'],
    right:   keys['ArrowRight'] || keys['KeyD'],
    up:      keys['ArrowUp']    || keys['KeyW'],
    down:    keys['ArrowDown']  || keys['KeyS'],
    light:   z && !shift,       // Z — light attack
    medium:  x,                 // X — medium attack
    heavy:   false,             // heavy not used
    special: shift && z,        // Shift + Z — special
  };
}

// ---- Main Loop ------------------------------------------------------
function loop(ts) {
  const dt = Math.min(ts - lastTs, 50);
  lastTs = ts;

  ctx.clearRect(0, 0, W, H);

  // Clear justPressed each frame (consumed on use)

  switch (gstate) {
    // --- Character Select ---
    case 'char_select': {
      drawCharSelect(CHARS, hovIdx, null, 'player');

      if (anyJustPressed('ArrowRight','KeyD')) hovIdx = (hovIdx+1) % CHARS.length;
      if (anyJustPressed('ArrowLeft','KeyA'))  hovIdx = (hovIdx-1+CHARS.length) % CHARS.length;
      if (anyJustPressed('ArrowDown','KeyS'))  hovIdx = (hovIdx+4) % CHARS.length;
      if (anyJustPressed('ArrowUp','KeyW'))    hovIdx = (hovIdx-4+CHARS.length) % CHARS.length;

      if (anyJustPressed('Enter','KeyZ','Space')) {
        if (!CHARS[hovIdx].preview) {
          selectedPlayer = CHARS[hovIdx];
          hovIdx = 0;
          gstate = 'opp_select';
        }
      }
      break;
    }

    // --- Opponent Select ---
    case 'opp_select': {
      drawCharSelect(CHARS, hovIdx, selectedPlayer, 'opp');

      if (anyJustPressed('ArrowRight','KeyD')) hovIdx = (hovIdx+1) % CHARS.length;
      if (anyJustPressed('ArrowLeft','KeyA'))  hovIdx = (hovIdx-1+CHARS.length) % CHARS.length;
      if (anyJustPressed('ArrowDown','KeyS'))  hovIdx = (hovIdx+4) % CHARS.length;
      if (anyJustPressed('ArrowUp','KeyW'))    hovIdx = (hovIdx-4+CHARS.length) % CHARS.length;

      if (anyJustPressed('Enter','KeyZ','Space')) {
        if (CHARS[hovIdx].id !== selectedPlayer.id && !CHARS[hovIdx].preview) {
          selectedOpponent = CHARS[hovIdx];
          bgChoice = 0; // default to Random for each new fight
          gstate = 'vs_confirm';
        }
      }
      if (anyJustPressed('Escape')) { gstate = 'char_select'; hovIdx = 0; selectedPlayer = null; }
      break;
    }

    // --- VS Confirmation ---
    case 'vs_confirm': {
      drawVSScreen(selectedPlayer, selectedOpponent, Date.now(), bgChoice);

      if (anyJustPressed('ArrowRight','KeyD')) bgChoice = (bgChoice + 1) % 5;
      if (anyJustPressed('ArrowLeft','KeyA'))  bgChoice = (bgChoice - 1 + 5) % 5;

      if (anyJustPressed('Enter','KeyZ','Space')) {
        roundNum = 1; p1wins = 0; p2wins = 0;
        // 0=Random → pick random; 1=Bunk Bed→3, 2=Pillow Fort→1, 3=Playground→2, 4=Toy Room→0
        const bgMap = [0, 3, 1, 2, 0];
        currentBg = bgChoice === 0 ? Math.floor(Math.random() * 4) : bgMap[bgChoice];
        startRound();
        gstate = 'fight';
      }
      if (anyJustPressed('Escape')) {
        selectedPlayer = null;
        selectedOpponent = null;
        gstate = 'char_select';
        hovIdx = 0;
      }
      break;
    }

    // --- Fight ---
    case 'fight': {
      // Toggle pause
      if (anyJustPressed('KeyP')) paused = !paused;

      drawBackground();
      updateParticles();

      if (!paused) {
        // Timer countdown
        if (announceFade <= 0) {
          roundTimerAccum += dt;
          if (roundTimerAccum >= 1000) {
            roundTimerAccum -= 1000;
            roundTimer--;
            if (roundTimer <= 0) {
              roundTimer = 0;
              if (player.health > opponent.health) resolveRound('p1_time');
              else if (opponent.health > player.health) resolveRound('p2_time');
              else resolveRound('draw');
            }
          }
        }

        // Announce fade
        if (announceFade > 0) {
          announceFade -= dt / 2000;
          if (announceMsg === `ROUND ${roundNum}` && announceFade < 0.45) announceMsg = 'FIGHT!';
        }

        // Update fighters
        const pInp = announceFade > 0 ? {} : getPlayerInput();
        const aInp = announceFade > 0 ? {} : ai.getInput(player);

        player.update(pInp);
        opponent.update(aInp);

        // Face each other
        if (!['hurt','knockdown'].includes(player.state))   player.facing   = player.x < opponent.x ? 1 : -1;
        if (!['hurt','knockdown'].includes(opponent.state)) opponent.facing = opponent.x < player.x ? 1 : -1;

        // Hit detection
        const pAtk = player.attackBox(), oHit = opponent.hitbox();
        if (pAtk && !player.attackHit && rectsOverlap(pAtk, oHit)) {
          if (opponent.takeDamage(player.attackDamage)) {
            player.attackHit = true;
            player.specialMeter = Math.min(100, player.specialMeter + 12);
            comboCount++; comboTimer = 90;
            if (opponent.health <= 0) resolveRound('p1_ko');
          }
        }

        const oAtk = opponent.attackBox(), pHit = player.hitbox();
        if (oAtk && !opponent.attackHit && rectsOverlap(oAtk, pHit)) {
          if (player.takeDamage(opponent.attackDamage)) {
            opponent.attackHit = true;
            opponent.specialMeter = Math.min(100, opponent.specialMeter + 12);
            comboCount = 0;
            if (player.health <= 0) resolveRound('p2_ko');
          }
        }

        if (comboTimer > 0) comboTimer--; else comboCount = 0;
      }

      // Draw fighters & HUD (always, even when paused)
      drawParticles();
      opponent.draw();
      player.draw();
      drawHUD(player, opponent, roundNum, roundTimer, p1wins, p2wins);
      drawFightAnnounce(announceMsg, Math.max(0, announceFade));

      // Combo display
      if (!paused && comboCount > 1 && comboTimer > 0) {
        ctx.save();
        const scale = 1 + Math.min(comboCount * 0.1, 0.8);
        ctx.fillStyle = '#f1c40f';
        ctx.font = `bold ${Math.floor(18 * scale)}px Arial`;
        ctx.textAlign = 'left';
        ctx.shadowBlur = 8; ctx.shadowColor = '#f1c40f';
        ctx.fillText(`${comboCount}x COMBO!`, 30, H - 48);
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // Pause overlay
      if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(255,200,80,0.7)';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 64px Arial';
        ctx.fillText('PAUSED', W/2, H/2 - 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '18px Arial';
        ctx.fillText('P — Resume   ·   Esc — Quit to menu', W/2, H/2 + 36);
        ctx.restore();
      }

      // Quit to character select
      if (anyJustPressed('Escape')) {
        paused = false;
        gstate = 'char_select';
        hovIdx = 0;
        selectedPlayer = null; selectedOpponent = null;
        player = null; opponent = null;
        p1wins = 0; p2wins = 0; roundNum = 1;
        particles = [];
      }

      break;
    }

    // --- Round End ---
    case 'round_end': {
      drawBackground();
      updateParticles();
      drawParticles();
      if (opponent) opponent.draw();
      if (player) player.draw();
      drawHUD(player, opponent, roundNum, 0, p1wins, p2wins);
      drawRoundEnd(roundResult, [selectedPlayer.name, selectedOpponent.name], p1wins, p2wins);

      roundEndTimer--;
      if (roundEndTimer <= 0 || anyJustPressed('Enter','Space','KeyZ')) {
        if (p1wins >= 2 || p2wins >= 2) {
          gstate = 'game_over';
        } else {
          roundNum++;
          startRound();
          gstate = 'fight';
        }
      }
      break;
    }

    // --- Game Over ---
    case 'game_over': {
      updateParticles();
      drawGameOver(p1wins > p2wins, selectedPlayer, selectedOpponent, p1wins, p2wins);
      drawParticles();
      // Confetti
      if (Math.random() < 0.3) {
        spawnParticles(Math.random() * W, Math.random() * H * 0.3, `hsl(${Math.random()*360},80%,60%)`, 1, 'star');
      }

      if (anyJustPressed('Enter','KeyR','Space')) {
        gstate = 'char_select';
        hovIdx = 0;
        selectedPlayer = null; selectedOpponent = null;
        player = null; opponent = null;
        p1wins = 0; p2wins = 0; roundNum = 1;
        particles = [];
      }
      break;
    }
  }

  // Clear justPressed that weren't consumed (prevent carry-over)
  Object.keys(justPressed).forEach(k => { justPressed[k] = false; });

  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
